<!DOCTYPE html><html lang="he" dir="rtl"><head>
<meta charset="utf-8"><meta http-equiv="Content-Language" content="he">
<script>document.documentElement.lang='he';</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2740%27 fill=%27none%27 stroke=%27%234f8ef7%27 stroke-width=%2710%27/%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2712%27 fill=%27%234f8ef7%27/%3E%3C/svg%3E">
<title>NC Digital · Client Pulse</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0e10;--srf:#131417;--srf2:#17181c;--hair:#232529;--hair2:#2e3136;--txt:#f2f3f5;--mid:#b6bac1;--dim:#7c828b;
--acc:#5b9cf6;--good:#3ecf8e;--warn:#e5a54b;--bad:#e5674b}
*{margin:0;box-sizing:border-box;font-family:'Heebo',Arial,sans-serif}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);min-height:100vh;font-size:15px;-webkit-font-smoothing:antialiased}
main{max-width:none;padding:0 clamp(20px,3vw,56px) 80px}
.num{font-variant-numeric:tabular-nums}
/* header */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:30px 0 0;flex-wrap:wrap}
.wordmark{font-size:15px;font-weight:800;letter-spacing:.2px}
.wordmark span{color:var(--dim);font-weight:400}
.top time{color:var(--dim);font-size:13px}
/* verdict */
.verdict{padding:44px 0 38px;border-bottom:1px solid var(--hair)}
.verdict .big{font-size:clamp(34px,4.2vw,56px);font-weight:800;letter-spacing:-1px;line-height:1.06}
.verdict .big em{font-style:normal;color:var(--good)}
.verdict .big em.w{color:var(--warn)}
.verdict .sub{color:var(--dim);font-size:16px;margin-top:10px;font-weight:400}
.verdict .sub b{color:var(--mid);font-weight:600}
/* KPI strip */
.kpis{display:flex;gap:0;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.kpi{padding:26px 44px 26px 0;margin-inline-end:44px;border-inline-end:1px solid var(--hair)}
.kpi:last-child{border-inline-end:none}
.kpi .n{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1}
.kpi .l{font-size:12.5px;color:var(--dim);margin-top:6px}
.kpi .d{font-size:12px;margin-inline-start:8px;font-weight:600}
.kpi .d.up{color:var(--good)} .kpi .d.down{color:var(--warn)}
/* two-column: ranking + digest */
.cols{display:grid;grid-template-columns:7fr 5fr;gap:56px;padding:38px 0;border-bottom:1px solid var(--hair)}
h3.sec{font-size:13px;font-weight:700;color:var(--mid);letter-spacing:.4px;margin-bottom:20px}
h3.sec small{color:var(--dim);font-weight:400;margin-inline-start:8px}
.rank .row{display:grid;grid-template-columns:22px minmax(120px,190px) 1fr 74px 60px;gap:14px;align-items:center;
 padding:9px 0;border-radius:6px;cursor:pointer;transition:background .12s}
.rank .row:hover{background:var(--srf2)}
.rank .i{color:var(--dim);font-size:12px;text-align:center}
.rank .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .track{height:6px;background:var(--srf2);border-radius:3px;overflow:hidden;display:flex;justify-content:flex-start}
.rank .fill{height:100%;background:var(--acc);border-radius:3px;width:0;transition:width .9s cubic-bezier(.22,1,.36,1);opacity:.85}
.rank .v{font-size:13px;font-weight:700;color:var(--mid);text-align:left;direction:ltr}
.rank .dd{font-size:12px;font-weight:600;text-align:left;direction:ltr;color:var(--dim)}
.rank .dd.up{color:var(--good)} .rank .dd.down{color:var(--warn)}
.digest .item{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-bottom:1px solid var(--hair);cursor:pointer}
.digest .item:hover .t{color:var(--txt)}
.digest .item:last-child{border-bottom:none}
.digest .t{color:var(--mid);font-size:14px;transition:color .12s}
.digest .t b{color:var(--txt);font-weight:700}
.digest .m{font-size:13px;color:var(--dim);white-space:nowrap;direction:ltr}
.digest .m.up{color:var(--good)} .digest .m.warn{color:var(--warn)}
.digest .none{color:var(--dim);font-size:13.5px;padding:10px 0}
.digest .grp{margin-bottom:26px}
/* toolbar + table */
.tools{display:flex;gap:10px;align-items:center;padding:26px 0 18px;flex-wrap:wrap}
.tools input{flex:1;min-width:260px;background:var(--srf);border:1px solid var(--hair2);border-radius:8px;color:var(--txt);
 padding:11px 16px;font-size:14px;outline:none;transition:border-color .15s}
.tools input::placeholder{color:var(--dim)}
.tools input:focus{border-color:var(--acc)}
.tools button{background:transparent;border:1px solid var(--hair2);border-radius:8px;color:var(--dim);padding:10px 16px;
 font-size:13px;cursor:pointer;font-weight:500;transition:.15s}
.tools button:hover{color:var(--txt);border-color:var(--dim)}
.tools button.on{color:var(--txt);background:var(--srf2);border-color:var(--dim);font-weight:700}
table{width:100%;border-collapse:collapse}
thead th{font-size:12px;color:var(--dim);font-weight:600;text-align:right;padding:12px 12px;border-bottom:1px solid var(--hair2);position:sticky;top:0;background:var(--bg);z-index:2}
thead th.l{text-align:left}
tbody td{padding:15px 12px;border-bottom:1px solid var(--hair);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--srf)}
td .nm{font-weight:700;font-size:14.5px}
td .dm{font-size:12px;color:var(--dim);direction:ltr;text-align:right;margin-top:1px}
td.l{text-align:left;direction:ltr}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 12px;border-radius:99px;border:1px solid}
.pill.ok{color:var(--good);border-color:rgba(62,207,142,.35)}
.pill.al{color:var(--warn);border-color:rgba(229,165,75,.45);background:rgba(229,165,75,.08)}
.delta{font-size:13px;font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--warn)} .delta.flat{color:var(--dim)}
.spark{width:104px;height:28px;display:block;margin-inline-start:auto}
.wintag{display:inline-block;font-size:11.5px;color:var(--acc);border:1px solid rgba(91,156,246,.35);border-radius:99px;padding:2px 10px;margin:4px 6px 0 0}
#empty{display:none;color:var(--dim);text-align:center;padding:44px;font-size:14px}
footer{margin-top:48px;color:var(--dim);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,6,8,.6);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(440px,94vw);background:var(--srf);border-inline-end:1px solid var(--hair2);
 z-index:50;transform:translateX(105%);transition:transform .28s cubic-bezier(.22,1,.36,1);padding:34px 32px;overflow-y:auto}
.drawer.on{transform:none}
.dclose{position:absolute;top:20px;inset-inline-end:20px;background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;padding:6px}
.dclose:hover{color:var(--txt)}
.drawer h2{font-size:24px;font-weight:800;letter-spacing:-.4px}
.drawer .ddom{font-size:12.5px;color:var(--dim);direction:ltr;text-align:right;margin:2px 0 24px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:10px;overflow:hidden;margin-bottom:26px}
.dgrid>div{background:var(--srf2);padding:16px 18px}
.dgrid .v{font-size:26px;font-weight:800;letter-spacing:-.5px}
.dgrid .v span{font-size:13px;font-weight:600;margin-inline-start:6px}
.dgrid .l{font-size:11.5px;color:var(--dim);margin-top:3px}
.dsec{padding:18px 0;border-top:1px solid var(--hair)}
.dsec h4{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.3px;margin-bottom:12px}
.dsec .li{display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:14px;color:var(--mid)}
.dsec .li b{direction:ltr;font-weight:600;color:var(--txt)}
.dsec .li.warn,.dsec .li.warn b{color:var(--warn)}
.dspark{width:100%;height:60px}
.dlink{display:inline-block;margin-top:14px;color:var(--bg);background:var(--txt);padding:10px 22px;font-weight:700;font-size:13.5px;text-decoration:none;border-radius:8px}
.dlink:hover{background:#fff}
@media(max-width:940px){.cols{grid-template-columns:1fr;gap:34px}.kpi{padding-inline-end:24px;margin-inline-end:24px}
 .rank .row{grid-template-columns:18px minmax(90px,130px) 1fr 64px}.rank .dd{display:none}.spark{width:70px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main>
<div class="top"><div class="wordmark">NC Digital <span>/ Client Pulse</span></div><time id="ts"></time></div>
<div class="verdict" id="verdict"><div class="big">טוען נתונים…</div></div>
<div class="kpis" id="kpis"></div>
<div class="cols">
 <section class="rank"><h3 class="sec">דירוג הלקוחות <small>לפי Visibility</small></h3><div id="rank"></div></section>
 <section class="digest">
  <div class="grp"><h3 class="sec" id="moversH">תנועות היום</h3><div id="movers"></div></div>
  <div class="grp"><h3 class="sec">כניסות חדשות ל-Top 10</h3><div id="wins"></div></div>
  <div class="grp"><h3 class="sec">התראות ומעקב</h3><div id="alerts"></div></div>
 </section>
</div>
<div class="tools">
 <input id="q" placeholder="חיפוש לקוח או דומיין" aria-label="חיפוש">
 <button data-s="flags" class="on">לפי סטטוס</button><button data-s="visibility">Visibility</button>
 <button data-s="kw">מילות מפתח</button><button data-s="name">שם</button>
 <button id="onlyflag" aria-pressed="false">רק התראות</button>
</div>
<table><thead><tr><th>לקוח</th><th>סטטוס</th><th class="l">מילות מפתח</th><th class="l">Visibility</th><th class="l">שינוי יומי</th><th class="l">Top 10</th><th class="l">מגמה</th></tr></thead>
<tbody id="tb"></tbody></table>
<div id="empty">לא נמצאו לקוחות תואמים</div>
<footer><span>NC Digital · Client Pulse</span><span id="ts2"></span></footer>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
</main>
<script>
'use strict';
let DATA=null,HIST={},sortBy='flags',q='',flagOnly=false;
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n??null)===null?'·':Number(n).toLocaleString();
const key=c=>c.domain||c.name;
const byKey=k=>DATA.clients.find(x=>key(x)===k);
function series(c){return (HIST[key(c)]||[]).map(p=>p.v).filter(v=>v!=null)}
function delta(c){const s=series(c);if(s.length<2)return null;const a=s[s.length-2],b=s[s.length-1];return a?Math.round(100*(b-a)/a):null}
function sparksvg(c,w,h,color){const s=series(c);if(s.length<2)return '';
 const mx=Math.max(...s),mn=Math.min(...s),r=mx-mn||1;
 const pts=s.map((v,i)=>`${(i/(s.length-1))*w},${h-3-((v-mn)/r)*(h-8)}`).join(' ');
 return `<svg viewBox="0 0 ${w} ${h}" class="spark" style="width:${w}px;height:${h}px"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/></svg>`}
function dcell(c){const d=delta(c);return d===null?'<span class="delta flat">—</span>':`<span class="delta ${d>0?'up':d<0?'down':'flat'}">${d>0?'+':''}${d}%</span>`}
function render(){
 let list=DATA.clients.filter(c=>(!q||c.name.toLowerCase().includes(q)||String(c.domain||'').toLowerCase().includes(q))&&(!flagOnly||c.flags.length));
 list.sort((a,b)=>sortBy==='flags'?(b.flags.length-a.flags.length)||((b.visibility||0)-(a.visibility||0))
  :sortBy==='name'?a.name.localeCompare(b.name,'he'):(b[sortBy]||0)-(a[sortBy]||0));
 $('tb').innerHTML=list.map(c=>{
  const wins=(c.wins||[]).length?`<div>${c.wins.map(w=>`<span class="wintag">${esc(w.kw)}</span>`).join('')}</div>`:'';
  return `<tr data-k="${esc(key(c))}">
   <td><div class="nm">${esc(c.name)}</div><div class="dm">${esc(c.domain||'')}</div>${wins}</td>
   <td>${c.flags.length?'<span class="pill al">דורש בדיקה</span>':'<span class="pill ok">תקין</span>'}</td>
   <td class="l num">${fmt(c.kw)}</td><td class="l num" style="font-weight:700">${fmt(c.visibility)}</td>
   <td class="l">${dcell(c)}</td><td class="l num">${fmt(c.top10)}</td>
   <td class="l">${sparksvg(c,104,28,'#5b9cf6')||'<span class="delta flat">—</span>'}</td></tr>`;}).join('');
 $('empty').style.display=list.length?'none':'block';
}
function rank(){
 const top=[...DATA.clients].sort((a,b)=>(b.visibility||0)-(a.visibility||0)).slice(0,12);
 const max=Math.max(1,...top.map(c=>c.visibility||0));
 $('rank').innerHTML=top.map((c,i)=>{const d=delta(c);
  return `<div class="row" data-k="${esc(key(c))}">
   <div class="i num">${i+1}</div><div class="nm">${esc(c.name)}</div>
   <div class="track"><div class="fill" data-w="${Math.max(2,Math.round(100*(c.visibility||0)/max))}"></div></div>
   <div class="v num">${fmt(c.visibility)}</div>
   <div class="dd num ${d>0?'up':d<0?'down':''}">${d===null?'':(d>0?'+':'')+d+'%'}</div></div>`}).join('');
 requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll('.rank .fill').forEach(el=>el.style.width=el.dataset.w+'%'),60));
}
function digest(){
 const movers=DATA.clients.map(c=>({c,d:delta(c)})).filter(x=>x.d).sort((a,b)=>b.d-a.d);
 if(movers.length){
  const items=[...movers.slice(0,3),...movers.slice(-2).filter(x=>x.d<0)];
  $('movers').innerHTML=items.map(x=>`<div class="item" data-k="${esc(key(x.c))}"><span class="t"><b>${esc(x.c.name)}</b></span><span class="m ${x.d>0?'up':'warn'}">${x.d>0?'+':''}${x.d}%</span></div>`).join('');
 }else{$('moversH').innerHTML='בולטים היום <small>עד שתיבנה השוואה יומית</small>';
  $('movers').innerHTML=[...DATA.clients].sort((a,b)=>(b.top10||0)-(a.top10||0)).slice(0,4)
   .map(c=>`<div class="item" data-k="${esc(key(c))}"><span class="t"><b>${esc(c.name)}</b> · ${fmt(c.top10)} מילים ב-Top 10</span><span class="m">${fmt(c.visibility)}</span></div>`).join('');}
 const wr=DATA.clients.flatMap(c=>(c.wins||[]).map(w=>({c,w})));
 $('wins').innerHTML=wr.length?wr.slice(0,7).map(x=>`<div class="item" data-k="${esc(key(x.c))}"><span class="t"><b>${esc(x.c.name)}</b> · ${esc(x.w.kw)}</span><span class="m up">${x.w.from??'—'} → ${x.w.to}</span></div>`).join('')
  :'<div class="none">אין כניסות חדשות היום. מופיעות כאן אוטומטית כשמילה נכנסת לעשירייה.</div>';
 const al=[];
 DATA.clients.forEach(c=>{c.flags.forEach(f=>al.push({k:key(c),n:c.name,t:f,w:true}));
  if(c.ssl_days!=null&&c.ssl_days<35)al.push({k:key(c),n:c.name,t:'חידוש SSL בעוד '+c.ssl_days+' ימים',w:c.ssl_days<21});});
 $('alerts').innerHTML=al.length?al.map(a=>`<div class="item" data-k="${esc(a.k)}"><span class="t"><b>${esc(a.n)}</b> · ${esc(a.t)}</span><span class="m ${a.w?'warn':''}">${a.w?'לטיפול':'במעקב'}</span></div>`).join('')
  :'<div class="none">אין התראות פעילות.</div>';
}
function counts(){
 const ok=DATA.clients.filter(c=>!c.flags.length).length,fl=DATA.clients.length-ok;
 const kw=DATA.clients.reduce((s,c)=>s+(c.kw||0),0),t10=DATA.clients.reduce((s,c)=>s+(c.top10||0),0);
 const wn=DATA.clients.reduce((s,c)=>s+(c.wins||[]).length,0);
 $('ts').textContent='עודכן '+DATA.generated; $('ts2').textContent='עודכן '+DATA.generated;
 $('kpis').innerHTML=[[DATA.clients.length,'לקוחות במעקב'],[ok,'תקינים'],[fl,'דורשים בדיקה'],[kw.toLocaleString(),'מילות מפתח'],[t10.toLocaleString(),'דירוגים ב-Top 10']]
  .map(x=>`<div class="kpi"><div class="n num">${x[0]}</div><div class="l">${x[1]}</div></div>`).join('');
 $('verdict').innerHTML= fl
  ? `<div class="big"><em class="w">${fl} לקוחות</em> דורשים את תשומת הלב שלך הבוקר</div>
     <div class="sub">הפרטים בהתראות ובשורות המסומנות בטבלה. שאר <b>${ok}</b> הלקוחות תקינים.</div>`
  : `<div class="big">בוקר טוב. <em>כל ${DATA.clients.length} הלקוחות תקינים.</em></div>
     <div class="sub">${wn?`<b>${wn}</b> מילים נכנסו ל-Top 10 · `:''}כל האתרים זמינים, ללא ממצאי אבטחה · לחיצה על לקוח פותחת את הפרופיל המלא</div>`;
}
function drawer(k){
 const c=byKey(k);if(!c)return;
 const d=delta(c);
 const sp=(function(){const s=series(c);if(s.length<2)return '';
  const w=376,h=60,mx=Math.max(...s),mn=Math.min(...s),r=mx-mn||1;
  const pts=s.map((v,i)=>`${(i/(s.length-1))*w},${h-4-((v-mn)/r)*(h-10)}`).join(' ');
  return `<svg class="dspark" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="#5b9cf6" stroke-width="2" stroke-linecap="round"/></svg>`})();
 $('drawer').innerHTML=`<button class="dclose" id="dclose" aria-label="סגירה">✕</button>
  <h2>${esc(c.name)}</h2><div class="ddom">${esc(c.domain||'')}</div>
  <div class="dgrid">
   <div><div class="v num">${fmt(c.visibility)}${d!==null?`<span style="color:${d>=0?'var(--good)':'var(--warn)'}">${d>0?'+':''}${d}%</span>`:''}</div><div class="l">Visibility</div></div>
   <div><div class="v num">${fmt(c.top10)}</div><div class="l">דירוגים ב-Top 10</div></div>
   <div><div class="v num">${fmt(c.kw)}</div><div class="l">מילות מפתח במעקב</div></div>
   <div><div class="v num">${c.ssl_days??'·'}</div><div class="l">ימים לחידוש SSL</div></div>
  </div>
  ${sp?`<div class="dsec"><h4>מגמת Visibility</h4>${sp}</div>`:''}
  <div class="dsec"><h4>כניסות חדשות ל-Top 10</h4>${(c.wins||[]).length?c.wins.map(w=>`<div class="li"><span>${esc(w.kw)}</span><b>${w.from??'—'} → ${w.to}</b></div>`).join(''):'<div class="li" style="color:var(--dim)">אין כניסות חדשות היום</div>'}</div>
  <div class="dsec"><h4>בדיקות תקינות</h4>
   <div class="li"><span>זמינות האתר</span><b>HTTP ${esc(c.http)}</b></div>
   <div class="li"><span>ספאם · robots · noindex</span><b>${c.flags.length?'ראו ממצאים':'תקין'}</b></div>
   ${c.flags.map(f=>`<div class="li warn"><span>${esc(f)}</span></div>`).join('')}
  </div>
  ${c.domain?`<a class="dlink" href="https://${esc(c.domain)}" target="_blank" rel="noopener">פתיחת האתר</a>`:''}`;
 $('drawer').classList.add('on');$('scrim').classList.add('on');$('drawer').setAttribute('aria-hidden','false');
 $('dclose').addEventListener('click',closeDrawer);
}
function closeDrawer(){$('drawer').classList.remove('on');$('scrim').classList.remove('on');$('drawer').setAttribute('aria-hidden','true')}
Promise.all([
 fetch('pulse-data.json?v='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}),
 fetch('pulse-history.json?v='+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({}))
]).then(([d,h])=>{DATA=d;HIST=h;counts();rank();digest();render();})
.catch(()=>{$('verdict').innerHTML='<div class="big">שגיאה בטעינת הנתונים</div>'});
$('scrim').addEventListener('click',closeDrawer);
document.addEventListener('click',e=>{
 const r=e.target.closest('[data-k]');
 if(r&&!e.target.closest('a')){drawer(r.dataset.k)}});
