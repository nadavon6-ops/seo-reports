<!DOCTYPE html><html lang="he" dir="rtl"><head>
<meta charset="utf-8"><meta http-equiv="Content-Language" content="he">
<script>document.documentElement.lang='he';</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2740%27 fill=%27none%27 stroke=%27%2357d0ff%27 stroke-width=%2710%27/%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2712%27 fill=%27%2357d0ff%27/%3E%3C/svg%3E">
<title>NC Digital · Client Pulse</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--txt:#eef2f8;--mid:#c3cddd;--dim:#8a97ab;--glass:rgba(255,255,255,.045);--gborder:rgba(255,255,255,.09);
--good:#3fd68c;--warn:#ffb257;--h1:#57d0ff;--h2:#b287ff;--h3:#ff7a6b;--h4:#ffb257;--h5:#3fd68c}
*{margin:0;box-sizing:border-box;font-family:Heebo,Arial,sans-serif}
body{min-height:100vh;font-size:16px;color:var(--txt);-webkit-font-smoothing:antialiased;
 background:radial-gradient(1300px 620px at 82% -12%,#1e2c4a,#0c111c 62%) fixed,#0c111c}
main{padding:30px clamp(18px,3vw,52px) 70px}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.wordmark{font-size:13px;letter-spacing:3px;color:var(--h1);font-weight:600}
.top time{color:var(--dim);font-size:15px}
.verdict{margin-bottom:28px}
.verdict .big{font-size:clamp(36px,4.4vw,58px);font-weight:900;letter-spacing:-.8px;line-height:1.08}
.verdict .big em{font-style:normal;color:var(--good)}
.verdict .big em.w{color:var(--warn)}
.verdict .sub{color:var(--dim);font-size:17px;margin-top:8px}
.verdict .sub b{color:var(--mid)}
.glass{background:var(--glass);border:1px solid var(--gborder);border-radius:16px;backdrop-filter:blur(10px)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.kpi{padding:16px 20px}
.kpi .n{font-size:34px;font-weight:900;line-height:1}
.kpi .l{font-size:14px;color:var(--dim);margin-top:5px}
.kpi.g .n{color:var(--good)} .kpi.w .n{color:var(--warn)} .kpi.b .n{color:var(--h1)}
.digest{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:26px}
.dg{padding:18px 20px}
.dg h3{font-size:13px;letter-spacing:2.5px;color:var(--dim);font-weight:600;margin-bottom:12px}
.dg .item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:15.5px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05)}
.dg .item:last-child{border-bottom:none}
.dg .item:hover .t{color:#fff}
.dg .t{color:var(--mid);transition:color .12s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dg .t b{color:var(--txt)}
.dg .m{color:var(--dim);font-size:14.5px;white-space:nowrap;direction:ltr}
.dg .m.up{color:var(--good)} .dg .m.warn{color:var(--warn)}
.dg .none{color:var(--dim);font-size:15px;padding:4px 0}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.tools input{flex:1;min-width:240px;background:var(--glass);border:1px solid var(--gborder);border-radius:12px;color:var(--txt);
 padding:14px 20px;font-size:16px;outline:none;backdrop-filter:blur(10px)}
.tools input::placeholder{color:var(--dim)}
.tools input:focus{border-color:var(--h1)}
.tools button{background:var(--glass);border:1px solid var(--gborder);border-radius:12px;color:var(--dim);padding:11px 18px;
 font-size:15px;cursor:pointer;backdrop-filter:blur(10px);transition:.15s}
.tools button:hover{color:var(--txt)}
.tools button.on{color:#0c111c;background:var(--h1);border-color:transparent;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.card{padding:24px;cursor:pointer;transition:transform .16s,border-color .16s;animation:in .4s cubic-bezier(.22,1,.36,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.22)}
.chead{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.hue{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0}
.nm{font-weight:800;font-size:17.5px;line-height:1.2}
.dm{font-size:13px;color:var(--dim);direction:ltr;text-align:right}
.pill{margin-inline-start:auto;font-size:12.5px;padding:4px 13px;border-radius:99px;white-space:nowrap}
.pill.ok{background:rgba(63,214,140,.12);color:var(--good);border:1px solid rgba(63,214,140,.3)}
.pill.al{background:rgba(255,178,87,.12);color:var(--warn);border:1px solid rgba(255,178,87,.4)}
.bigv{font-size:38px;font-weight:900;line-height:1;margin-bottom:14px;display:flex;align-items:baseline;gap:12px}
.bigv small{font-size:13px;color:var(--dim);font-weight:600}
.bigv .d{font-size:15px;font-weight:700}
.bigv .d.up{color:var(--good)} .bigv .d.down{color:var(--warn)}
.sp{width:100%;height:46px;margin-bottom:14px;display:block}
.sp-wait{height:46px;margin-bottom:14px;display:flex;align-items:center;font-size:12.5px;color:var(--dim)}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--dim)}
.wins{margin-top:12px}
.wintag{display:inline-block;font-size:13px;color:var(--h1);border:1px solid rgba(87,208,255,.35);border-radius:99px;padding:2px 10px;margin:2px 4px 0 0}
#empty{display:none;color:var(--dim);text-align:center;padding:44px}
footer{margin-top:44px;display:flex;justify-content:space-between;color:#41506a;font-size:14px;flex-wrap:wrap;gap:8px}
.scrim{position:fixed;inset:0;background:rgba(4,7,14,.65);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(430px,94vw);background:rgba(14,20,34,.97);border-inline-end:1px solid var(--gborder);
 z-index:50;transform:translateX(105%);transition:transform .26s cubic-bezier(.22,1,.36,1);padding:32px 30px;overflow-y:auto;backdrop-filter:blur(20px)}
.drawer.on{transform:none}
.dclose{position:absolute;top:18px;inset-inline-end:18px;background:none;border:none;color:var(--dim);font-size:19px;cursor:pointer}
.dclose:hover{color:#fff}
.drawer h2{font-size:27px;font-weight:900}
.drawer .ddom{font-size:14px;color:var(--dim);direction:ltr;text-align:right;margin:2px 0 22px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.dgrid>div{background:var(--glass);border:1px solid var(--gborder);border-radius:12px;padding:14px 16px}
.dgrid .v{font-size:29px;font-weight:900}
.dgrid .v span{font-size:12px;font-weight:700;margin-inline-start:6px}
.dgrid .l{font-size:13px;color:var(--dim);margin-top:2px}
.dsec{padding:16px 0;border-top:1px solid rgba(255,255,255,.07)}
.dsec h4{font-size:13px;color:var(--dim);letter-spacing:2px;margin-bottom:10px}
.dsec .li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:15.5px;color:var(--mid)}
.dsec .li b{direction:ltr;color:var(--txt)}
.dsec .li.warn,.dsec .li.warn b{color:var(--warn)}
.dlink{display:inline-block;margin-top:14px;color:#0c111c;background:var(--h1);padding:12px 26px;font-weight:800;font-size:15px;text-decoration:none;border-radius:10px}
#ekgline{stroke-dasharray:46 210;animation:beat 2.1s linear infinite;filter:drop-shadow(0 0 5px currentColor)}
@keyframes beat{from{stroke-dashoffset:256}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>
<div class="top"><div><div class="wordmark">NC DIGITAL</div><div style="display:flex;align-items:center;gap:14px"><div style="font-size:26px;font-weight:900">Client Pulse</div>
<svg id="ekg" width="120" height="34" viewBox="0 0 120 34" aria-hidden="true">
 <polyline id="ekgline" points="0,17 22,17 30,17 36,6 42,28 48,17 60,17 78,17 84,10 90,24 96,17 120,17"
  fill="none" stroke="#3fd68c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg></div></div><div style="text-align:left"><div id="clock" class="num" style="font-size:22px;font-weight:800"></div><time id="ts" style="color:var(--dim);font-size:14px"></time></div></div>
<div class="verdict" id="verdict"><div class="big">טוען נתונים…</div></div>
<div class="kpis" id="kpis"></div>
<div class="digest">
 <div class="dg glass"><h3 id="moversH">תנועות היום</h3><div id="movers"></div></div>
 <div class="dg glass"><h3>כניסות חדשות ל-TOP 10</h3><div id="wins"></div></div>
 <div class="dg glass"><h3>התראות ומעקב</h3><div id="alerts"></div></div>
</div>
<div class="tools">
 <input id="q" placeholder="חיפוש לקוח או דומיין" aria-label="חיפוש">
 <button data-s="flags" class="on">לפי סטטוס</button><button data-s="visibility">Visibility</button>
 <button data-s="kw">מילות מפתח</button><button data-s="name">שם</button>
 <button id="onlyflag" aria-pressed="false">רק התראות</button>
</div>
<div class="grid" id="grid"></div>
<div id="empty">לא נמצאו לקוחות תואמים</div>
<footer><span>NC Digital · Client Pulse</span><span id="ts2"></span></footer>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
</main>
<script>
'use strict';
let DATA=null,HIST={},sortBy='flags',q='',flagOnly=false;
const HUES=['#57d0ff','#b287ff','#ff7a6b','#ffb257','#3fd68c'];
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n??null)===null?'·':Number(n).toLocaleString();
const key=c=>c.domain||c.name;
const hue=c=>HUES[DATA.clients.indexOf(c)%HUES.length];
function series(c){return (HIST[key(c)]||[]).map(p=>p.v).filter(v=>v!=null)}
function delta(c){const s=series(c);if(s.length<2)return null;const a=s[s.length-2],b=s[s.length-1];return a?Math.round(100*(b-a)/a):null}
function spark(c,w,h){const s=series(c);if(s.length<2)return null;
 const mx=Math.max(...s),mn=Math.min(...s),r=mx-mn||1;
 const pts=s.map((v,i)=>`${(i/(s.length-1))*w},${h-3-((v-mn)/r)*(h-8)}`).join(' ');
 return `<svg class="sp" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${hue(c)}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function render(){
 let list=DATA.clients.filter(c=>(!q||c.name.toLowerCase().includes(q)||String(c.domain||'').toLowerCase().includes(q))&&(!flagOnly||c.flags.length));
 list.sort((a,b)=>sortBy==='flags'?(b.flags.length-a.flags.length)||((b.visibility||0)-(a.visibility||0))
  :sortBy==='name'?a.name.localeCompare(b.name,'he'):(b[sortBy]||0)-(a[sortBy]||0));
 $('grid').innerHTML=list.map((c,i)=>{
  const d=delta(c),sp=spark(c,300,46);
  return `<div class="card glass" data-k="${esc(key(c))}" style="animation-delay:${Math.min(i*22,400)}ms" tabindex="0">
   <div class="chead"><span class="hue" style="background:${hue(c)}"></span>
    <div><div class="nm">${esc(c.name)}</div><div class="dm">${esc(c.domain||'')}</div></div>
    ${c.flags.length?'<span class="pill al">דורש בדיקה</span>':'<span class="pill ok">תקין</span>'}</div>
   <div class="bigv num" style="color:${hue(c)}">${fmt(c.visibility)}<small>Visibility</small>${d!==null?`<span class="d ${d>=0?'up':'down'}">${d>0?'+':''}${d}%</span>`:''}</div>
   ${sp||'<div class="sp-wait">גרף מגמה נבנה מנתוני הסריקות היומיות</div>'}
   <div class="meta"><span>${fmt(c.kw)} מילות מפתח</span><span>${fmt(c.top10)} ב-Top 10</span></div>
   ${(c.wins||[]).length?`<div class="wins">${c.wins.map(w=>`<span class="wintag">${esc(w.kw)}</span>`).join('')}</div>`:''}
  </div>`;}).join('');
 $('empty').style.display=list.length?'none':'block';
}
function digest(){
 const movers=DATA.clients.map(c=>({c,d:delta(c)})).filter(x=>x.d).sort((a,b)=>b.d-a.d);
 if(movers.length){
  const items=[...movers.slice(0,3),...movers.slice(-2).filter(x=>x.d<0)];
  $('movers').innerHTML=items.map(x=>`<div class="item" data-k="${esc(key(x.c))}"><span class="t"><b>${esc(x.c.name)}</b></span><span class="m ${x.d>0?'up':'warn'}">${x.d>0?'+':''}${x.d}%</span></div>`).join('');
 }else{$('moversH').textContent='המובילים כעת';
  $('movers').innerHTML=[...DATA.clients].sort((a,b)=>(b.visibility||0)-(a.visibility||0)).slice(0,4)
   .map(c=>`<div class="item" data-k="${esc(key(c))}"><span class="t"><b>${esc(c.name)}</b></span><span class="m">${fmt(c.visibility)}</span></div>`).join('');}
 const wr=DATA.clients.flatMap(c=>(c.wins||[]).map(w=>({c,w})));
 $('wins').innerHTML=wr.length?wr.slice(0,6).map(x=>`<div class="item" data-k="${esc(key(x.c))}"><span class="t"><b>${esc(x.c.name)}</b> · ${esc(x.w.kw)}</span><span class="m up">${x.w.from??'—'} → ${x.w.to}</span></div>`).join('')
  :'<div class="none">אין כניסות חדשות היום. מילים שנכנסות לעשירייה יופיעו כאן.</div>';
 const al=[];
 DATA.clients.forEach(c=>{c.flags.forEach(f=>al.push({k:key(c),n:c.name,t:f,w:true}));
  if(c.ssl_days!=null&&c.ssl_days<35)al.push({k:key(c),n:c.name,t:'חידוש SSL בעוד '+c.ssl_days+' ימים',w:c.ssl_days<21});});
 $('alerts').innerHTML=al.length?al.map(a=>`<div class="item" data-k="${esc(a.k)}"><span class="t"><b>${esc(a.n)}</b> · ${esc(a.t)}</span><span class="m ${a.w?'warn':''}">${a.w?'לטיפול':'במעקב'}</span></div>`).join('')
  :'<div class="none">אין התראות פעילות.</div>';
}
function greet(){const h=new Date().getHours();
 return h>=5&&h<12?'בוקר טוב.':h<15?'צהריים טובים.':h<18?'אחר צהריים טובים.':h<23?'ערב טוב.':'לילה טוב.';}
function counts(){
 const ok=DATA.clients.filter(c=>!c.flags.length).length,fl=DATA.clients.length-ok;
 const kw=DATA.clients.reduce((s,c)=>s+(c.kw||0),0),t10=DATA.clients.reduce((s,c)=>s+(c.top10||0),0);
 const wn=DATA.clients.reduce((s,c)=>s+(c.wins||[]).length,0);
 $('ts2').textContent='עודכן '+DATA.generated;
 function freshness(){try{const m=DATA.generated.match(/(\d+)\/(\d+)\/(\d+) (\d+):(\d+)/);
  const t=new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]);const mins=Math.max(0,Math.round((Date.now()-t)/60000));
  $('ts').textContent='עודכן לפני '+(mins<60?mins+' דקות':mins<2880?Math.round(mins/60)+' שעות':Math.round(mins/1440)+' ימים');}catch(e){$('ts').textContent='עודכן '+DATA.generated}}
 freshness();setInterval(freshness,60000);
 function tick(){const n=new Date();$('clock').textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':')}
 tick();setInterval(tick,1000);
 $('kpis').innerHTML=[['b',DATA.clients.length,'לקוחות במעקב'],['g',ok,'תקינים'],['w',fl,'דורשים בדיקה'],['',kw.toLocaleString(),'מילות מפתח'],['',t10.toLocaleString(),'דירוגים ב-Top 10']]
  .map(x=>`<div class="kpi glass ${x[0]}"><div class="n num">${x[1]}</div><div class="l">${x[2]}</div></div>`).join('');
 const ek=document.getElementById('ekgline');if(ek)ek.setAttribute('stroke',fl?'#ffb257':'#3fd68c');
 $('verdict').innerHTML= fl
  ? `<div class="big">${greet()} <em class="w">${fl} לקוחות</em> דורשים את תשומת הלב שלך</div><div class="sub">הפרטים בעמודת ההתראות ובכרטיסים המסומנים. שאר <b>${ok}</b> הלקוחות תקינים.</div>`
  : `<div class="big">${greet()} <em>כל ${DATA.clients.length} הלקוחות תקינים.</em></div>
     <div class="sub">${wn?`<b>${wn}</b> מילים נכנסו ל-Top 10 · `:''}כל האתרים זמינים וללא ממצאי אבטחה · לחיצה על כרטיס פותחת את הפרופיל המלא</div>`;
}
function drawer(k){
 const c=DATA.clients.find(x=>key(x)===k);if(!c)return;
 const d=delta(c),sp=spark(c,368,56);
 $('drawer').innerHTML=`<button class="dclose" id="dclose" aria-label="סגירה">✕</button>
  <h2>${esc(c.name)}</h2><div class="ddom">${esc(c.domain||'')}</div>
  <div class="dgrid">
   <div><div class="v num" style="color:${hue(c)}">${fmt(c.visibility)}${d!==null?`<span style="color:${d>=0?'var(--good)':'var(--warn)'}">${d>0?'+':''}${d}%</span>`:''}</div><div class="l">Visibility</div></div>
   <div><div class="v num">${fmt(c.top10)}</div><div class="l">דירוגים ב-Top 10</div></div>
   <div><div class="v num">${fmt(c.kw)}</div><div class="l">מילות מפתח במעקב</div></div>
   <div><div class="v num">${c.ssl_days??'·'}</div><div class="l">ימים לחידוש SSL</div></div>
  </div>
  ${sp?`<div class="dsec"><h4>מגמת VISIBILITY</h4>${sp}</div>`:''}
  <div class="dsec"><h4>כניסות חדשות ל-TOP 10</h4>${(c.wins||[]).length?c.wins.map(w=>`<div class="li"><span>${esc(w.kw)}</span><b>${w.from??'—'} → ${w.to}</b></div>`).join(''):'<div class="li" style="color:var(--dim)">אין כניסות חדשות היום</div>'}</div>
  <div class="dsec"><h4>בדיקות תקינות</h4>
   <div class="li"><span>זמינות האתר</span><b>HTTP ${esc(c.http)}</b></div>
   <div class="li"><span>ספאם · robots · noindex</span><b>${c.flags.length?'ראו ממצאים':'תקין'}</b></div>
   ${c.flags.map(f=>`<div class="li warn"><span>${esc(f)}</span></div>`).join('')}
  </div>
  ${c.domain?`<a class="dlink" href="https://${esc(c.domain)}" target="_blank" rel="noopener">פתיחת האתר</a>`:''}`;
 $('drawer').classList.add('on');$('scrim').classList.add('on');$('drawer').setAttribute('aria-hidden','false');
 $('dclose').addEventListener('click',closeDrawer);
}
function closeDrawer(){$('drawer').classList.remove('on');$('scrim').classList.remove('on');$('drawer').setAttribute('aria-hidden','true')}
Promise.all([
 fetch('pulse-data.json?v='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}),
 fetch('pulse-history.json?v='+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({}))
]).then(([d,h])=>{DATA=d;HIST=h;counts();digest();render();})
.catch(()=>{$('verdict').innerHTML='<div class="big">שגיאה בטעינת הנתונים</div>'});
$('scrim').addEventListener('click',closeDrawer);
document.addEventListener('click',e=>{const r=e.target.closest('[data-k]');if(r&&!e.target.closest('a'))drawer(r.dataset.k)});
document.addEventListener('keydown',e=>{const r=e.target.closest?.('[data-k]');
 if((e.key==='Enter'||e.key===' ')&&r){e.preventDefault();drawer(r.dataset.k)}
 if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}
 if(e.key==='Escape'){q='';$('q').value='';closeDrawer();render()}});
$('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render()});
$('onlyflag').addEventListener('click',()=>{flagOnly=!flagOnly;$('onlyflag').classList.toggle('on',flagOnly);$('onlyflag').setAttribute('aria-pressed',String(flagOnly));render()});
document.querySelectorAll('.tools button[data-s]').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('.tools button[data-s]').forEach(x=>x.classList.remove('on'));b.classList.add('on');sortBy=b.dataset.s;render();}));
</script></body></html>
