<!DOCTYPE html><html lang="he" dir="rtl"><head>
<meta charset="utf-8"><meta http-equiv="Content-Language" content="he">
<script>document.documentElement.lang = 'he';</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2740%27 fill=%27none%27 stroke=%27%2322d3ee%27 stroke-width=%2710%27/%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2712%27 fill=%27%2322d3ee%27/%3E%3C/svg%3E">
<title>NC Digital · Client Pulse</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#04070f;--panel:rgba(13,23,42,.72);--line:rgba(56,110,180,.22);--cyan:#22d3ee;--cyan2:#0891b2;
--amber:#fbbf24;--green:#34d399;--red:#f87171;--txt:#e6eef9;--dim:#64809f;--glow:rgba(34,211,238,.55)}
*{margin:0;box-sizing:border-box;font-family:'Heebo',Arial,sans-serif}
html,body{width:100%}
body{background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;position:relative}
/* cinematic background */
body:before{content:'';position:fixed;inset:0;z-index:-2;
 background:radial-gradient(1000px 500px at 85% -5%,rgba(8,145,178,.22),transparent 60%),
            radial-gradient(900px 600px at 10% 110%,rgba(34,211,238,.10),transparent 60%),
            radial-gradient(600px 300px at 50% 40%,rgba(56,110,180,.08),transparent 70%)}
body:after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:linear-gradient(rgba(34,80,140,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(34,80,140,.13) 1px,transparent 1px);
 background-size:52px 52px;mask-image:radial-gradient(ellipse 90% 80% at 50% 20%,#000 30%,transparent 100%)}
.scan{position:fixed;left:0;right:0;top:-2px;height:2px;z-index:5;pointer-events:none;opacity:.45;
 background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scan 7s linear infinite}
@keyframes scan{to{transform:translateY(100vh)}}
main{padding:clamp(18px,2.2vw,44px);width:100%}
/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:26px;flex-wrap:wrap;margin-bottom:26px;
 background:linear-gradient(120deg,rgba(13,23,42,.85),rgba(9,16,32,.6));border:1px solid var(--line);border-radius:20px;
 padding:22px clamp(20px,2.4vw,40px);backdrop-filter:blur(8px);position:relative;overflow:hidden}
header:before{content:'';position:absolute;inset:0;background:
 radial-gradient(400px 120px at 20% 0%,rgba(34,211,238,.12),transparent);pointer-events:none}
.brand .tag{font-size:11px;letter-spacing:3px;color:var(--cyan);opacity:.85}
.brand h1{font-size:clamp(28px,3vw,44px);font-weight:900;letter-spacing:1px;line-height:1.05}
.brand h1 b{color:var(--cyan);text-shadow:0 0 26px var(--glow)}
.brand .ts{color:var(--dim);font-size:13px;margin-top:4px}
.hud{display:flex;align-items:center;gap:30px;flex-wrap:wrap}
.ring{position:relative;width:120px;height:120px;flex-shrink:0}
.ring .radar{position:absolute;inset:8px;border-radius:50%;overflow:hidden;opacity:.5;
 background:conic-gradient(from 0deg,rgba(34,211,238,.5),transparent 22%);animation:spin 4.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ring svg{position:relative;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--dim)}
.ring .pct b{font-size:29px;color:var(--green);text-shadow:0 0 16px rgba(52,211,153,.6)}
/* KPI band */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:26px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 22px;position:relative;overflow:hidden;backdrop-filter:blur(6px)}
.kpi:before{content:'';position:absolute;inset-inline-start:0;top:14%;bottom:14%;width:3px;border-radius:2px;background:var(--cyan);box-shadow:0 0 16px var(--cyan)}
.kpi.warn:before{background:var(--amber);box-shadow:0 0 16px var(--amber)}
.kpi.good:before{background:var(--green);box-shadow:0 0 16px var(--green)}
.kpi .n{font-size:clamp(30px,2.6vw,42px);font-weight:900;letter-spacing:1px;line-height:1}
.kpi .t{font-size:12.5px;color:var(--dim);margin-top:6px}
/* leaderboard */
.panelbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px clamp(18px,2vw,32px);margin-bottom:26px;backdrop-filter:blur(6px)}
.panelbox h2{font-size:15px;color:var(--cyan);letter-spacing:1.5px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.panelbox h2:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.lb{display:grid;gap:9px}
.lbrow{display:grid;grid-template-columns:minmax(140px,220px) 1fr 90px;align-items:center;gap:14px;font-size:13px}
.lbname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbtrack{height:12px;border-radius:7px;background:rgba(16,29,51,.9);overflow:hidden;position:relative}
.lbfill{height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#0e7490,var(--cyan));
 box-shadow:0 0 14px rgba(34,211,238,.45);transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.lbrow:nth-child(1) .lbfill{background:linear-gradient(90deg,#0e7490,#67e8f9)}
.lbval{color:var(--cyan);font-weight:800;text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
/* status banner */
.banner{display:flex;align-items:center;gap:14px;border-radius:16px;padding:16px 24px;margin-bottom:26px;font-weight:600}
.banner.ok{background:rgba(6,60,40,.35);border:1px solid rgba(52,211,153,.35);color:var(--green)}
.banner.bad{background:rgba(80,55,8,.3);border:1px solid rgba(251,191,36,.4);color:var(--amber)}
.pulse-dot{width:12px;height:12px;border-radius:50%;background:currentColor;position:relative;flex-shrink:0}
.pulse-dot:after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid currentColor;opacity:.6;animation:ripple 1.6s ease-out infinite}
@keyframes ripple{to{transform:scale(1.9);opacity:0}}
/* controls */
.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.controls input{flex:1;min-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--txt);
 padding:13px 18px;font-size:14.5px;outline:none;backdrop-filter:blur(6px);transition:.2s}
.controls input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,211,238,.12)}
.controls button{background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--dim);
 padding:12px 20px;font-size:13.5px;cursor:pointer;transition:.18s;backdrop-filter:blur(6px)}
.controls button:hover{color:var(--txt);border-color:var(--cyan2)}
.controls button.on{color:#04121a;background:linear-gradient(120deg,var(--cyan),#67e8f9);border-color:transparent;font-weight:800;box-shadow:0 0 20px rgba(34,211,238,.35)}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(305px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;
 backdrop-filter:blur(6px);transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;overflow:hidden;
 animation:enter .5s cubic-bezier(.22,1,.36,1) both}
@keyframes enter{from{opacity:0;transform:translateY(16px)}}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--cyan2);box-shadow:0 14px 40px rgba(8,145,178,.22);outline:none}
.card.flag{border-color:rgba(146,96,10,.6)}
.card.flag:hover{border-color:var(--amber);box-shadow:0 14px 40px rgba(251,191,36,.15)}
.chead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px}
.cname{font-weight:800;font-size:16px;line-height:1.2}
.cdom{color:var(--dim);font-size:11.5px;direction:ltr;text-align:right;margin-top:2px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);flex-shrink:0;margin-top:6px}
.flag .dot{background:var(--amber);box-shadow:0 0 12px var(--amber);animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:12px}
.stat{background:rgba(16,29,51,.55);border-radius:11px;padding:9px 3px;border:1px solid rgba(56,110,180,.12)}
.stat .v{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.stat .l{font-size:10px;color:var(--dim);margin-top:1px}
.bar{height:6px;border-radius:4px;background:rgba(16,29,51,.9);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan2),var(--cyan));border-radius:4px;
 box-shadow:0 0 10px rgba(34,211,238,.5);transition:width 1s cubic-bezier(.22,1,.36,1)}
.fl{margin-top:12px;font-size:12px;color:var(--amber);background:rgba(122,90,18,.14);border:1px solid rgba(122,90,18,.4);border-radius:10px;padding:8px 12px}
.detail{max-height:0;overflow:hidden;transition:max-height .35s ease}
.card.open .detail{max-height:260px}
.detail .inner{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--dim);display:grid;gap:6px}
.detail a{color:var(--cyan);text-decoration:none;font-weight:600}
.detail a:hover{text-shadow:0 0 12px var(--glow)}
#empty{color:var(--dim);text-align:center;padding:50px;display:none;font-size:15px}
footer{margin-top:44px;text-align:center;color:#2b3d55;font-size:12px}
@media (max-width:640px){.lbrow{grid-template-columns:110px 1fr 64px}.hud{width:100%;justify-content:center}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body>
<div class="scan"></div>
<main>
<header>
 <div class="brand"><div class="tag">NC DIGITAL COMMAND CENTER</div><h1>CLIENT <b>PULSE</b></h1><div class="ts" id="ts"></div></div>
 <div class="hud"><div class="ring"><div class="radar"></div>
  <svg width="120" height="120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(16,29,51,.9)" stroke-width="8"/>
  <circle id="ringc" cx="60" cy="60" r="52" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round"
   stroke-dasharray="327" stroke-dashoffset="327" style="transition:stroke-dashoffset 1.4s cubic-bezier(.22,1,.36,1)"/></svg>
  <div class="pct"><b id="okpct">0%</b>תקינים</div></div></div>
</header>
<div class="kpis">
 <div class="kpi"><div class="n" id="k_total">0</div><div class="t">לקוחות במעקב</div></div>
 <div class="kpi good"><div class="n" id="k_ok">0</div><div class="t">תקינים</div></div>
 <div class="kpi warn"><div class="n" id="k_flag">0</div><div class="t">דורשים בדיקה</div></div>
 <div class="kpi"><div class="n" id="k_kw">0</div><div class="t">מילות מפתח במעקב</div></div>
 <div class="kpi"><div class="n" id="k_top10">0</div><div class="t">מילים ב-Top 10</div></div>
</div>
<div id="banner"></div>
<div class="panelbox"><h2>VISIBILITY LEADERBOARD</h2><div class="lb" id="lb"></div></div>
<div class="controls">
 <input id="q" placeholder="חיפוש לקוח או דומיין... ( / )" aria-label="חיפוש לקוח">
 <button data-s="flags" class="on">לפי סטטוס</button>
 <button data-s="kw">לפי מילות מפתח</button>
 <button data-s="visibility">לפי Visibility</button>
 <button data-s="name">לפי שם</button>
 <button id="onlyflag" aria-pressed="false">רק דורשים בדיקה</button>
</div>
<div class="grid" id="grid" role="list"></div>
<div id="empty">לא נמצאו לקוחות תואמים</div>
<footer>NC Digital · Client Pulse · <span id="ts2"></span></footer>
</main>
<script>
'use strict';
let DATA=null,sortBy='flags',q='',flagOnly=false,expanded=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n??null)===null?'·':Number(n).toLocaleString();
function render(){
 if(!DATA)return;
 const maxVis=Math.max(1,...DATA.clients.map(c=>Math.sqrt(c.visibility||0)));
 let list=DATA.clients.filter(c=>(!q||c.name.toLowerCase().includes(q)||String(c.domain||'').toLowerCase().includes(q))&&(!flagOnly||c.flags.length));
 list.sort((a,b)=>sortBy==='flags'?(b.flags.length-a.flags.length)||((b.visibility||0)-(a.visibility||0))
  :sortBy==='name'?a.name.localeCompare(b.name,'he')
  :(b[sortBy]||0)-(a[sortBy]||0));
 $('grid').innerHTML=list.map((c,i)=>{
  const pct=Math.round(100*Math.sqrt(c.visibility||0)/maxVis);
  const key=esc(c.name);
  return `<div class="card ${c.flags.length?'flag':''} ${expanded===c.name?'open':''}" data-k="${key}" role="listitem" tabindex="0"
    aria-label="${key}" style="animation-delay:${Math.min(i*28,500)}ms">
   <div class="chead"><div><div class="cname">${key}</div><div class="cdom">${esc(c.domain||'')}</div></div><div class="dot"></div></div>
   <div class="stats">
    <div class="stat"><div class="v">${fmt(c.kw)}</div><div class="l">מילות מפתח</div></div>
    <div class="stat"><div class="v">${fmt(c.visibility)}</div><div class="l">Visibility</div></div>
    <div class="stat"><div class="v">${fmt(c.top10)}</div><div class="l">Top 10</div></div>
   </div>
   <div class="bar"><i data-w="${pct}"></i></div>
   ${c.flags.length?`<div class="fl">${c.flags.map(esc).join(' · ')}</div>`:''}
   <div class="detail"><div class="inner">
     <span>סטטוס אתר: HTTP ${esc(c.http)}</span>
     <span>${c.flags.length?'ממצאים: '+c.flags.map(esc).join(' · '):'אין ממצאים פעילים'}</span>
     ${c.domain?`<a href="https://${esc(c.domain)}" target="_blank" rel="noopener">פתיחת האתר בלשונית חדשה</a>`:''}
   </div></div>
  </div>`;}).join('');
 requestAnimationFrame(()=>document.querySelectorAll('.bar i').forEach(el=>{el.style.width=el.dataset.w+'%'}));
 $('empty').style.display=list.length?'none':'block';
}
function leaderboard(){
 const top=[...DATA.clients].sort((a,b)=>(b.visibility||0)-(a.visibility||0)).slice(0,10);
 const max=Math.max(1,...top.map(c=>c.visibility||0));
 $('lb').innerHTML=top.map(c=>`<div class="lbrow"><div class="lbname">${esc(c.name)}</div>
  <div class="lbtrack"><div class="lbfill" data-w="${Math.max(2,Math.round(100*(c.visibility||0)/max))}"></div></div>
  <div class="lbval">${fmt(c.visibility)}</div></div>`).join('');
 requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll('.lbfill').forEach(el=>{el.style.width=el.dataset.w+'%'}),80));
}
function animate(id,to){const el=$(id),t0=performance.now();
 const step=t=>{const p=Math.min(1,(t-t0)/1100);el.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString();if(p<1)requestAnimationFrame(step)};
 requestAnimationFrame(step);}
fetch('pulse-data.json?v='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
 DATA=d;
 const ok=d.clients.filter(c=>!c.flags.length).length,flag=d.clients.length-ok;
 $('ts').textContent='סריקה אחרונה: '+d.generated; $('ts2').textContent=d.generated;
 animate('k_total',d.clients.length);animate('k_ok',ok);animate('k_flag',flag);
 animate('k_kw',d.clients.reduce((s,c)=>s+(c.kw||0),0));
 animate('k_top10',d.clients.reduce((s,c)=>s+(c.top10||0),0));
 const p=d.clients.length?Math.round(100*ok/d.clients.length):0;
 $('okpct').textContent=p+'%';
 setTimeout(()=>{$('ringc').style.strokeDashoffset=String(327*(1-p/100))},150);
 $('banner').innerHTML=flag
  ?`<div class="banner bad"><span class="pulse-dot"></span>${flag} לקוחות דורשים בדיקה השבוע. הכרטיסים הכתומים מרוכזים בראש הרשימה.</div>`
  :`<div class="banner ok"><span class="pulse-dot"></span>כל המערכות תקינות. ${d.clients.length} לקוחות נסרקו, אפס ממצאים פעילים.</div>`;
 leaderboard();render();
}).catch(()=>{$('grid').innerHTML='';$('empty').style.display='block';$('empty').textContent='שגיאה בטעינת הנתונים';});
$('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render()});
$('onlyflag').addEventListener('click',()=>{flagOnly=!flagOnly;$('onlyflag').classList.toggle('on',flagOnly);$('onlyflag').setAttribute('aria-pressed',String(flagOnly));render()});
document.querySelectorAll('.controls button[data-s]').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('.controls button[data-s]').forEach(x=>x.classList.remove('on'));
 b.classList.add('on');sortBy=b.dataset.s;render();}));
$('grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c||e.target.closest('a'))return;
 expanded=expanded===c.dataset.k?null:c.dataset.k;render();});
$('grid').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const c=e.target.closest('.card');if(c){e.preventDefault();expanded=expanded===c.dataset.k?null:c.dataset.k;render();}}});
document.addEventListener('keydown',e=>{
 if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus();}
 if(e.key==='Escape'){q='';$('q').value='';expanded=null;render();}});
</script></body></html>
