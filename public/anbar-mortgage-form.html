<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>אנבר · מערכת טפסי משכנתא לחתימה דיגיטלית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── tokens ─────────────────────────────────────────────────────────────── */
:root{
  --paper:#F5F3EE;        /* warm desk surface, not the usual blue-grey */
  --surface:#FFFFFF;
  --sunk:#FCFBF8;
  --ink:#131A26;
  --ink2:#525C6B;
  --ink3:#8D93A0;
  --rule:#DFDACF;         /* warm hairline */
  --rule2:#EDE9E1;
  --navy:#061E5C;
  --navy2:#0D2E7A;
  --accent:#229BFF;
  --ok:#15654B; --ok-bg:#EAF3EF;
  --warn:#8A5A00; --warn-bg:#FAF3E4;
  --err:#9E2B1E; --err-bg:#FBEDEB;
  --sans:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;max-width:100%;overflow-x:hidden}
body{
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 0;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--navy2)}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.015em;color:var(--navy)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ── top strip ──────────────────────────────────────────────────────────── */
.bar{
  height:54px; background:var(--surface); border-bottom:1px solid var(--rule);
  display:flex; align-items:center; gap:14px; padding:0 20px;
  position:sticky; top:0; z-index:60;
}
.mark{display:flex;align-items:baseline;gap:8px}
.mark b{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-.03em}
.mark span{font-size:12.5px;color:var(--ink3)}
.bar-rule{width:1px;height:20px;background:var(--rule)}
.bar-sp{flex:1}
.ghost{
  background:none;border:1px solid var(--rule);color:var(--ink2);border-radius:5px;
  padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.ghost:hover{border-color:var(--navy);color:var(--navy);background:var(--sunk)}
.pill{
  font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);
  border:1px solid #EBDCB8;border-radius:99px;padding:3px 10px;white-space:nowrap;
}

/* ── app grid: steps · work · document ──────────────────────────────────── */
.app{
  display:grid; grid-template-columns:168px minmax(0,1fr) 300px;
  gap:0; max-width:1290px; margin:0 auto; align-items:start;
}
.steps{position:sticky;top:54px;padding:26px 18px 26px 8px}
.work{padding:24px 28px 64px;border-inline:1px solid var(--rule);background:var(--surface);min-width:0;overflow-wrap:anywhere}
.docpane{position:sticky;top:54px;padding:26px 18px}
@media(max-width:1180px){
  .app{grid-template-columns:160px minmax(0,1fr)}
  .docpane{display:none}
}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .steps{position:static;padding:12px 14px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .steps .eyebrow{display:none}
  .steplist{display:flex;gap:4px;width:max-content}
  .st{padding:6px 11px}
  .work{border-inline:0;padding:18px 14px 70px}
}
@media(max-width:600px){
  .bar{height:auto;min-height:52px;padding:8px 12px;gap:8px;flex-wrap:wrap}
  .bar .pill,.bar .bar-rule{display:none}
  .bar-sp{flex:1 0 0}
  .mark span{display:none}
  .ghost{padding:5px 10px;font-size:12px}
  .head h1{font-size:21px}
  .grid,.grid.two{grid-template-columns:1fr}
  .pgrid{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .kv>div:nth-child(odd){border-bottom:0;padding-bottom:0;background:none}
  .foot{padding:18px 14px 32px}
}

/* ── step rail ──────────────────────────────────────────────────────────── */
.eyebrow{
  font-size:10.5px;font-weight:700;color:var(--ink3);letter-spacing:.11em;
  margin:0 0 10px;
}
.steplist{display:flex;flex-direction:column;gap:1px}
.st{
  display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;
  padding:7px 10px;text-align:start;color:var(--ink2);font-size:14px;border-radius:5px;
  position:relative;white-space:nowrap;width:100%;
}
.st:hover:not(:disabled){background:#EFEBE3;color:var(--ink)}
.st:disabled{opacity:.4;cursor:not-allowed}
.st i{
  font-style:normal;font-size:11px;font-weight:700;color:var(--ink3);
  font-variant-numeric:tabular-nums;width:12px;text-align:center;flex:0 0 12px;
}
.st.done i{color:var(--ok)}
.st.on{background:var(--navy);color:#fff;font-weight:700}
.st.on i{color:rgba(255,255,255,.62)}

/* ── document pane ──────────────────────────────────────────────────────── */
.dp{border:1px solid var(--rule);border-radius:6px;background:var(--surface);overflow:hidden}
.dp-top{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--rule2)}
.dp-thumb{
  width:62px;height:88px;flex:0 0 62px;border:1px solid var(--rule);border-radius:3px;
  background:var(--sunk);overflow:hidden;display:block;
}
.dp-thumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.dp-t{font-size:14.5px;font-weight:700;color:var(--navy);line-height:1.3}
.dp-m{font-size:11.5px;color:var(--ink3);margin-top:4px;font-variant-numeric:tabular-nums}
.dp-sec{padding:12px 14px;border-bottom:1px solid var(--rule2)}
.dp-sec:last-child{border-bottom:0}
.dp-k{font-size:10.5px;font-weight:700;color:var(--ink3);letter-spacing:.09em;margin-bottom:7px}
.dp-list{list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--ink2)}
.dp-list li{padding:3px 0;display:flex;gap:7px;align-items:flex-start;line-height:1.45}
.dp-list li::before{content:"";width:3px;height:3px;border-radius:50%;background:var(--rule);margin-top:8px;flex:0 0 3px}
.dp-warn{font-size:12px;color:var(--warn);line-height:1.45}
.dp-empty{padding:34px 14px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.7}
.dp-prev{padding:12px}
.dp-prev canvas{width:100%;height:auto;border:1px solid var(--rule);display:block;background:#fff}
.dp-prev .cap{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:8px;font-variant-numeric:tabular-nums}

/* ── work column ────────────────────────────────────────────────────────── */
.head{margin-bottom:26px}
.head h1{font-size:25px;line-height:1.2}
.head p{margin:6px 0 0;color:var(--ink2);font-size:13.5px;max-width:58ch;line-height:1.5}
.sec{margin-top:30px}
.sec:first-of-type{margin-top:22px}
.sec-h{display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:1.5px solid var(--navy);margin-bottom:16px}
.sec-h h3{font-size:15.5px;font-weight:700}
.sec-h .tag{margin-inline-start:auto;font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.02em}
.subhead{font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.02em;margin:20px 0 10px}
.rule{border:0;border-top:1px solid var(--rule2);margin:18px 0}

/* ── fields ─────────────────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 14px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f>label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.f>label .req{color:var(--err)}
.f>label .hint{font-weight:400;color:var(--ink3);font-size:11.5px}
.f input[type=text],.f input[type=number],.f input[type=date],.f input[type=email],
.f input[type=tel],.f select,.f textarea{
  width:100%;padding:7px 9px;background:var(--sunk);border:1px solid var(--rule);
  border-radius:4px;font-size:14.5px;transition:border-color .11s,background .11s;
}
.f input:hover,.f select:hover{border-color:#CFC8B9}
.f input:focus,.f select:focus,.f textarea:focus{
  outline:0;background:#fff;border-color:var(--navy);box-shadow:0 0 0 1px var(--navy);
}
.f input.bad,.f select.bad{border-color:var(--err);background:var(--err-bg)}
.f .msg{font-size:11.5px;color:var(--err)}
.f input[type=number],.f input[data-money]{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.money{position:relative}
.money input{padding-inline-end:24px;text-align:start}
.money::after{content:"₪";position:absolute;inset-inline-end:9px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:12.5px;pointer-events:none}

/* option chips — flat, filled when chosen */
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opts.stack{flex-direction:column;align-items:stretch}
.opt{
  position:relative;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  border:1px solid var(--rule);border-radius:4px;padding:6px 11px;background:#fff;
  font-size:13.5px;color:var(--ink2);transition:.11s;line-height:1.35;
}
.opt:hover{border-color:var(--navy);color:var(--ink)}
.opt input{position:absolute;opacity:0;width:0;height:0;margin:0}
.opt.sel{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.opt.sel::before{content:"✓";font-size:11px;opacity:.85}

/* purpose grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.pcard{
  position:relative;display:flex;align-items:center;gap:8px;cursor:pointer;
  border:1px solid var(--rule);border-radius:4px;padding:9px 11px;background:#fff;
  font-size:13.5px;color:var(--ink2);transition:.11s;line-height:1.35;
}
.pcard:hover{border-color:var(--navy);color:var(--ink)}
.pcard input{position:absolute;opacity:0;width:0;height:0}
.pcard.sel{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.pcard.sel::before{content:"✓";font-size:11px;opacity:.85}

/* repeatable rows */
.rows{display:flex;flex-direction:column;gap:10px}
.row{border:1px solid var(--rule);border-radius:5px;background:var(--surface);overflow:hidden}
.row-h{
  display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--sunk);
  border-bottom:1px solid var(--rule2);font-size:13px;
}
.row-h i{
  font-style:normal;font-variant-numeric:tabular-nums;font-size:10.5px;font-weight:700;
  color:#fff;background:var(--navy);width:17px;height:17px;border-radius:3px;
  display:grid;place-items:center;flex:0 0 17px;
}
.row-h b{font-weight:700;color:var(--navy)}
.row-h .del{
  margin-inline-start:auto;background:none;border:0;color:var(--ink3);cursor:pointer;
  font-size:12px;padding:2px 6px;border-radius:3px;
}
.row-h .del:hover{color:var(--err);background:var(--err-bg)}
.row-b{padding:13px 12px}
.addrow{
  align-self:flex-start;background:none;border:1px dashed var(--rule);color:var(--ink2);
  border-radius:4px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;
}
.addrow:hover:not(:disabled){border-color:var(--navy);color:var(--navy);border-style:solid;background:var(--sunk)}
.addrow:disabled{opacity:.45;cursor:not-allowed}

.when{display:none;margin-top:10px;padding-inline-start:12px;border-inline-start:2px solid var(--rule)}
.when.on{display:block}

/* ── notes ──────────────────────────────────────────────────────────────── */
.note{border-radius:5px;padding:11px 13px;font-size:13px;margin-bottom:14px;border:1px solid;line-height:1.5}
.note.info{background:var(--sunk);border-color:var(--rule);color:var(--ink2)}
.note.warn{background:var(--warn-bg);border-color:#EBDCB8;color:var(--warn)}
.note.ok{background:var(--ok-bg);border-color:#CBE1D8;color:var(--ok)}
.note b{font-weight:700}
.note ul{margin:6px 0 0;padding-inline-start:16px}
.note li{margin:2px 0}

/* ── step 0 · document picker ───────────────────────────────────────────── */
.lgroup{margin-bottom:26px}
.lgroup-h{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.lgroup-h b{font-size:14px;font-weight:800;color:var(--navy);letter-spacing:-.01em}
.lgroup-h span{flex:1;height:1px;background:var(--rule)}
.lgroup-h em{font-style:normal;font-size:11.5px;color:var(--ink3)}
.docs{display:flex;flex-direction:column;gap:7px}
.doc{
  display:flex;gap:13px;align-items:center;width:100%;text-align:start;cursor:pointer;
  border:1px solid var(--rule);border-radius:5px;background:var(--surface);
  padding:10px 13px;transition:.12s;position:relative;
}
.doc:hover{border-color:var(--navy);background:var(--sunk)}
.doc.sel{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);background:var(--sunk)}
.doc-t .badge{
  font-size:10px;font-weight:700;color:#fff;background:var(--navy);border-radius:3px;
  padding:2px 7px;margin-inline-start:8px;vertical-align:middle;
}
.doc-th{
  width:58px;height:82px;flex:0 0 58px;border:1px solid var(--rule);border-radius:2px;
  background:var(--sunk);overflow:hidden;
}
.doc-th canvas{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.doc-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
.doc-t{font-size:15px;font-weight:700;color:var(--navy);line-height:1.25}
.doc-m{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.doc-d{font-size:12.5px;color:var(--ink2);line-height:1.45;max-width:64ch}
.doc.off{border-style:dashed;background:none;cursor:not-allowed}
.doc.off .doc-t{color:var(--ink3)}
.doc.off .doc-th{border-style:dashed;display:grid;place-items:center;color:var(--ink3);font-size:18px}
.doc.off .miss{
  display:inline-block;font-size:10.5px;font-weight:700;color:var(--warn);
  background:var(--warn-bg);border:1px solid #EBDCB8;border-radius:3px;padding:1px 7px;
}

/* ── review ─────────────────────────────────────────────────────────────── */
.rev{border:1px solid var(--rule);border-radius:5px;margin-bottom:10px;overflow:hidden}
.rev-h{display:flex;align-items:center;padding:9px 13px;background:var(--sunk);border-bottom:1px solid var(--rule2)}
.rev-h b{font-size:13.5px;font-weight:700;color:var(--navy)}
.rev-h button{margin-inline-start:auto;background:none;border:0;color:var(--ink3);cursor:pointer;font-size:12px;font-weight:600;padding:2px 7px;border-radius:3px}
.rev-h button:hover{color:var(--navy);background:#EFEBE3}
.kv{display:grid;grid-template-columns:auto 1fr}
.kv>div{padding:6px 13px;border-bottom:1px solid var(--rule2);font-size:13px}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.kv>div:nth-child(odd){color:var(--ink2);font-weight:600;white-space:nowrap;background:#FDFCFA}
.kv>div:nth-child(even){color:var(--ink);font-variant-numeric:tabular-nums}
.kv .empty{color:var(--ink3)}
.miss-list{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.miss-list button{
  text-align:start;background:#fff;border:1px solid #EBDCB8;border-radius:4px;padding:7px 11px;
  cursor:pointer;font-size:12.5px;color:var(--warn);display:flex;gap:8px;align-items:center;
}
.miss-list button:hover{background:var(--warn-bg)}
.miss-list button span{margin-inline-start:auto;font-size:11px;opacity:.75}

/* ── send ───────────────────────────────────────────────────────────────── */
.send{border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-top:22px}
.send-h{padding:11px 14px;background:var(--navy);color:#fff;font-size:14.5px;font-weight:700}
.send-b{padding:15px 14px}
.flow{display:grid;gap:1px;background:var(--rule2);border:1px solid var(--rule2);border-radius:5px;overflow:hidden;margin-bottom:15px}
.fl{display:flex;gap:11px;padding:11px 13px;background:#fff}
.fl i{
  font-style:normal;font-variant-numeric:tabular-nums;font-size:10.5px;font-weight:700;
  color:#fff;background:var(--navy);width:18px;height:18px;border-radius:3px;
  display:grid;place-items:center;flex:0 0 18px;margin-top:2px;
}
.fl b{display:block;font-size:13.5px;font-weight:700;color:var(--navy)}
.fl p{margin:1px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.45}
.fl.pending{background:#FDFCFA}
.fl.pending i{background:var(--ink3)}
.pv{border:1px solid var(--rule);border-radius:5px;background:var(--sunk);min-height:110px;display:grid;place-items:center;padding:16px;text-align:center;color:var(--ink2);font-size:13px}
.pv canvas{max-width:100%;height:auto;border:1px solid var(--rule);background:#fff;display:block;margin:0 auto 9px}
.pgnav{display:flex;gap:7px;align-items:center;justify-content:center;font-size:12.5px;color:var(--ink2)}
.pgnav button{border:1px solid var(--rule);background:#fff;border-radius:4px;width:27px;height:27px;cursor:pointer;font-weight:700;color:var(--navy)}
.pgnav button:disabled{opacity:.4;cursor:not-allowed}
.spin{width:22px;height:22px;border:2px solid var(--rule);border-top-color:var(--navy);border-radius:50%;animation:sp .75s linear infinite;margin:0 auto 8px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── buttons / nav ──────────────────────────────────────────────────────── */
.nav{display:flex;gap:9px;align-items:center;margin-top:26px;padding-top:18px;border-top:1px solid var(--rule2);flex-wrap:wrap}
.nav .sp{flex:1}
.btn{border:1px solid transparent;border-radius:5px;padding:9px 18px;font-weight:700;font-size:14.5px;cursor:pointer;transition:.12s}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.p{background:var(--navy);color:#fff}
.btn.p:hover:not(:disabled){background:var(--navy2)}
.btn.g{background:#fff;color:var(--ink2);border-color:var(--rule)}
.btn.g:hover:not(:disabled){border-color:var(--navy);color:var(--navy)}
.btn.n{background:var(--accent);color:#fff}
.btn.n:hover:not(:disabled){background:#118AEC}

/* ── modal ──────────────────────────────────────────────────────────────── */
.mask{position:fixed;inset:0;background:rgba(19,26,38,.42);display:none;z-index:100;align-items:center;justify-content:center;padding:18px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:7px;max-width:600px;width:100%;max-height:86vh;overflow:auto;border:1px solid var(--rule);box-shadow:0 20px 60px rgba(19,26,38,.24)}
.modal>header{padding:18px 20px 0;font-size:17.5px;font-weight:800;color:var(--navy);letter-spacing:-.015em}
.modal>.mbody{padding:13px 20px 18px}
.modal>footer{padding:0 20px 18px;display:flex;gap:9px}
.dl{list-style:none;margin:0;padding:0}
.dl li{padding:6px 0;border-bottom:1px solid var(--rule2);font-size:13px;display:flex;gap:9px;align-items:flex-start;line-height:1.45}
.dl li:last-child{border:0}
.dl .b{font-size:14px;line-height:1.15;flex:0 0 auto;font-weight:700}

.foot{padding:22px 26px 40px;color:var(--ink3);font-size:11.5px;line-height:1.7;border-top:1px solid var(--rule2);margin-top:30px}

</style>
</head>
<body>

<div class="bar">
  <div class="mark"><b>אנבר</b><span>טפסי משכנתא</span></div>
  <div class="bar-rule"></div>
  <span class="pill">אב־טיפוס · נתוני דמו בלבד</span>
  <div class="bar-sp"></div>
  <button type="button" class="ghost" id="loadDemo">טען נתוני דמו</button>
  <button type="button" class="ghost" id="clearAll">נקה</button>
</div>

<div class="app">
  <nav class="steps" id="rail"></nav>
  <main class="work" id="main"></main>
  <aside class="docpane" id="docpane"></aside>
</div>
<div class="foot">NC Digital · אב־טיפוס עבור אנבר משכנתאות · הדף אינו מאונדקס, אינו שומר מידע ואינו שולח דבר. אין להזין פרטי לקוח אמיתיים.</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="/anbar-form/assets/anbar-field-map.js"></script>
<script>
/* ============================================================================
   ANBAR — multi-lender mortgage application console

// Israeli ID checksum (Luhn-like, weights 1,2 alternating, digits summed)
function validId(v){
  const s=String(v||"").trim();
  if(!/^\d{5,9}$/.test(s)) return false;
  const p=s.padStart(9,"0");
  let sum=0;
  for(let i=0;i<9;i++){
    let d=+p[i]*((i%2)+1);
    if(d>9) d-=9;
    sum+=d;
  }
  return sum%10===0;
}

                     || /^0\d{8,9}$/.test(String(v||"").replace(/[\s-]/g,""));
const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v||"").trim());

/* ---------- large first-page preview into the side pane ---------- */
let previewToken=0;
async function previewInPane(file,caption){
  const box=document.getElementById("dpPrev");
  if(!box||!file||!window.pdfjsLib) return;
  const my=++previewToken;
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const doc=await pdfjsLib.getDocument(`/anbar-form/pdf/${file}.pdf`).promise;
    if(my!==previewToken) return;
    const pg=await doc.getPage(1);
    const vp=pg.getViewport({scale:1.15});
    const c=document.createElement("canvas");
    c.width=vp.width; c.height=vp.height;
    await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    if(my!==previewToken) return;
    box.innerHTML="";
    box.appendChild(c);
    const cap=document.createElement("div");
    cap.className="cap"; cap.textContent=caption+" · עמוד 1";
    box.appendChild(cap);
  }catch(e){}
}

/* ---------- real first-page thumbnails of each lender document ---------- */
const THUMBS={};
async function paintThumbs(){
  const nodes=[...document.querySelectorAll("[data-thumb]")].filter(n=>n.dataset.thumb&&!n.dataset.done);
  for(const n of nodes){
    const file=n.dataset.thumb;
    n.dataset.done="1";
    try{
      if(!THUMBS[file]){
        if(!window.pdfjsLib) return;
        pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        const doc=await pdfjsLib.getDocument(`/anbar-form/pdf/${file}.pdf`).promise;
        const pg=await doc.getPage(1);
        const vp=pg.getViewport({scale:0.42});
        const c=document.createElement("canvas");
        c.width=vp.width; c.height=vp.height;
        await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
        THUMBS[file]=c.toDataURL("image/png");
      }
      const img=new Image();
      img.src=THUMBS[file];
      img.style.cssText="width:100%;height:100%;object-fit:cover;object-position:top;display:block";
      n.innerHTML=""; n.appendChild(img);
    }catch(e){ n.dataset.done=""; }
  }
}

/* ---------- field builders ---------- */
function fInput(path,label,opt={}){
  const v = getv(path);
  const id = "f_"+path.replace(/[^\w]/g,"_");
  const err = S.errors[path];
  const type = opt.type||"text";
  const inner = opt.money
    ? `<div class="money"><input type="text" inputmode="numeric" id="${id}" data-p="${esc(path)}" data-money="1" value="${v===""?"":Number(v).toLocaleString("en-US")}" class="${err?"bad":""}"></div>`
    : `<input type="${type}" id="${id}" data-p="${esc(path)}" value="${esc(v)}" ${opt.maxlength?`maxlength="${opt.maxlength}"`:""} ${opt.placeholder?`placeholder="${esc(opt.placeholder)}"`:""} class="${err?"bad":""}">`;
  return `<div class="f ${opt.wide?"wide":""}">
    <label for="${id}">${esc(label)}${opt.req?' <span class="req">*</span>':""}${opt.hint?` <span class="hint">${esc(opt.hint)}</span>`:""}</label>
    ${inner}${err?`<div class="msg">${esc(err)}</div>`:""}</div>`;
}
function fSelect(path,label,opts,o={}){
  const v=getv(path), id="f_"+path.replace(/[^\w]/g,"_"), err=S.errors[path];
  return `<div class="f ${o.wide?"wide":""}">
    <label for="${id}">${esc(label)}${o.req?' <span class="req">*</span>':""}</label>
    <select id="${id}" data-p="${esc(path)}" class="${err?"bad":""}">
      <option value="">בחר…</option>
      ${opts.map(x=>`<option value="${esc(x)}" ${v===x?"selected":""}>${esc(x)}</option>`).join("")}
    </select>${err?`<div class="msg">${esc(err)}</div>`:""}</div>`;
}
function fRadio(path,label,opts,o={}){
  const v=getv(path);
  return `<div class="f ${o.wide?"wide":""}">
    <label>${esc(label)}${o.req?' <span class="req">*</span>':""}</label>
    <div class="opts ${o.stack?"stack":""}">
      ${opts.map(x=>`<label class="opt ${v===x?"sel":""}"><input type="radio" data-p="${esc(path)}" value="${esc(x)}" ${v===x?"checked":""}><span>${esc(x)}</span></label>`).join("")}
    </div></div>`;
}
function fCheck(path,label){
  const v=!!getv(path);
  return `<label class="opt ${v?"sel":""}"><input type="checkbox" data-p="${esc(path)}" ${v?"checked":""}><span>${esc(label)}</span></label>`;
}
function fArea(path,label,o={}){
  const v=getv(path), id="f_"+path.replace(/[^\w]/g,"_");
  return `<div class="f wide"><label for="${id}">${esc(label)}</label>
    <textarea id="${id}" data-p="${esc(path)}" rows="${o.rows||3}">${esc(v)}</textarea></div>`;
}
function when(cond,html){ return `<div class="when ${cond?"on":""}">${html}</div>`; }

function getv(path){
  const parts = path.split(".");
  let o = S.data;
  for(let i=0;i<parts.length;i++){
    if(o==null) return "";
    const k = parts[i];
    o = /^\d+$/.test(k) ? o[+k] : o[k];
  }
  return o==null?"":o;
}
function setv(path,val){
  const parts = path.split(".");
  let o = S.data;
  for(let i=0;i<parts.length-1;i++){
    const k=parts[i];
    o = /^\d+$/.test(k) ? o[+k] : o[k];
  }
  const last = parts[parts.length-1];
  if(/^\d+$/.test(last)) o[+last]=val; else o[last]=val;
}

function sec(title,tag,body){
  return `<section class="sec"><div class="sec-h"><h3>${esc(title)}</h3>${tag?`<span class="tag">${esc(tag)}</span>`:""}</div>${body}</section>`;
}
function rowsBlock(key,label,max,render,blank,addLabel){
  const arr = S.data[key];
  return `<div class="rows">
    ${arr.map((_,i)=>`<article class="row"><div class="row-h"><i>${i+1}</i><b>${esc(label)}</b>
        ${arr.length>1?`<button type="button" class="del" data-del="${key}:${i}">הסר</button>`:""}
      </div><div class="row-b">${render(i)}</div></article>`).join("")}
    <button type="button" class="addrow" data-add="${key}" ${arr.length>=max?"disabled":""}>+ ${esc(addLabel)}${arr.length>=max?` · מקסימום ${max}`:""}</button>
  </div>`;
}

      <div class="grid">${fRadio(`collateral.${i}.mortgaged`,"האם ממושכן כיום?",["לא","כן"])}</div>
      ${when(c.mortgaged==="כן",`<div class="grid">
        ${fInput(`collateral.${i}.mortgagedTo`,"למי?")}
        ${fInput(`collateral.${i}.mortgageBalance`,"יתרת המשכנתא לסילוק",{money:true})}
      </div>`)}
      <div class="grid" style="margin-top:12px">${fRadio(`collateral.${i}.seized`,"האם מעוקל כיום?",["לא","כן"])}</div>
      ${when(c.seized==="כן",`<div class="grid">
        ${fInput(`collateral.${i}.seizedTo`,"למי?")}
        ${fInput(`collateral.${i}.seizedBalance`,"יתרת החוב לסילוק",{money:true})}
      </div>`)}
      <div class="grid" style="margin-top:12px">${fRadio(`collateral.${i}.rented`,"האם מושכר כיום?",["לא","כן"])}</div>
      ${when(c.rented==="כן",`<div class="grid">${fInput(`collateral.${i}.rentAmount`,"דמי השכירות החודשיים",{money:true})}</div>`)}`;
    },blankCollateral,"הוסף נכס לשעבוד")
    + `<div class="note ok" id="collSum" style="margin:14px 0 0"><b>סה"כ שווי הנכסים המוצעים לשעבוד:</b> ${total?nis(total):"—"}</div>`);

  if(r.lender==="כלל"){
    h += sec("משכנתא קיימת בכלל","שדה בטופס כלל",
      `<div class="grid">${fRadio("clal.existingMortgage","יש לי משכנתא קיימת ב\"כלל\"",["לא","כן"],{wide:true})}</div>
       ${when(S.data.clal.existingMortgage==="כן",
        `<div class="grid">${fRadio("clal.existingOnListed","המשכנתא הקיימת היא על אחד הנכסים המפורטים בבקשה זו",["לא","כן"],{wide:true})}</div>`)}`);
  }

  h += sec("נכסים נוספים בבעלות — שאינם מיועדים לשיעבוד בבקשה זו",`עד ${r.maxOther}`,
    `<div class="note info">נכס כזה יוצר חבות אפשרית במס שבח, שעשויה להשפיע על קביעת שווי הבטוחה.</div>`
    + rowsBlock("other","נכס נוסף",r.maxOther,i=>`
      <div class="grid">
        ${fRadio(`other.${i}.type`,"תיאור הנכס",["בית פרטי","דירה","נכס מסחרי"])}
      </div>
      <div class="grid" style="margin-top:12px">
        ${fInput(`other.${i}.address`,"כתובת",{wide:true})}
      </div>
      <div class="grid" style="margin-top:12px">
        ${fInput(`other.${i}.value`,"שווי משוער",{money:true,step:10000})}
        ${fInput(`other.${i}.rentIncome`,"הכנסה משכר דירה (לחודש)",{money:true})}
        ${fInput(`other.${i}.mortgagedTo`,"אם ממושכן — למי?")}
        ${fInput(`other.${i}.mortgageBalance`,"יתרת המשכנתא",{money:true})}
      </div>`,blankOther,"הוסף נכס נוסף"));

  return h + nav();
}

/* ---------- STEP 4 · loan ---------- */
function step4(){
  const r=R(), p=S.data.purpose;
  const sum = S.data.tracks.reduce((a,t)=>a+(+t.amount||0),0);
  const req = +p.amount||0;
  const diff = req-sum;

  let h=`<div class="head"><h1>ההלוואה המבוקשת</h1><p>מטרה, מקורות מימון ומסלולי תשלום.</p></div>`;

  if(r.spansBoth){
    h += sec("מטרת העסקה","נבחר בתוך הטופס",
      `<div class="grid">${fRadio("deal.rank","דרגה",r.dealPurpose,{wide:true})}</div>`);
  }

  h += sec("מטרת ההלוואה","",
    `<div class="pgrid">
      ${r.purposeOpts.map(o=>{
        const on=(p.list||[]).includes(o);
        return `<label class="pcard ${on?"sel":""}"><input type="checkbox" data-purpose="${esc(o)}" ${on?"checked":""}> ${esc(o)}</label>`;
      }).join("")}
    </div>
    ${when((p.list||[]).includes("מטרה אחרת"),fInput("purpose.otherDetail","פרט את המטרה",{wide:true}))}
    ${when((p.list||[]).includes("השקעה"),fInput("purpose.investDetail","פרטי ההשקעה",{wide:true}))}
    ${when((p.list||[]).some(x=>x.indexOf("סילוק הלוואה")===0),`<div class="grid">
      ${fInput("purpose.payoffDetail","פירוט ההלוואה/ההתחייבות")}
      ${fInput("purpose.payoffBalance","יתרת חוב",{money:true})}
    </div>`)}`);

  const isPurchase = (p.list||[]).some(x=>x.indexOf("רכיש")>-1);
  if(has("purchase")||isPurchase){
    h += sec("רכישת נכס","נפתח כשנבחרה מטרת רכישה",
      isPurchase ? `
      <div class="grid">
        ${fRadio("purchase.kind","הנכס הוא",["דירה יחידה","דירה חלופית","דירה להשקעה"],{wide:true})}
      </div>
      <div class="grid" style="margin-top:12px">
        ${fRadio("purchase.hand","אופן הרכישה",["הנכס יירכש מקבלן (יד ראשונה)","הנכס יירכש מיד שניה"],{wide:true})}
      </div>
      <div style="font-weight:700;color:var(--navy);margin:16px 0 9px;font-size:14.5px">מקורות המימון שלנו</div>
      <div class="grid">
        ${fInput("purchase.fromSale","ממכירת נכס קיים",{money:true,step:10000})}
        ${fInput("purchase.equitySource","מהון עצמי, שמקורו")}
        ${fInput("purchase.equityAmount","סכום ההון העצמי",{money:true,step:10000})}
        ${fInput("purchase.fromLoan","מההלוואה המבוקשת כאן",{money:true,step:10000})}
      </div>
      <div class="grid" style="margin-top:12px">
        ${fRadio("purchase.sellerRelation","קשר משפחתי בין הלווה למוכר הנכס",["אין","יש"],{wide:true})}
      </div>
      ${when(S.data.purchase.sellerRelation==="יש",fInput("purchase.sellerDetail","פרט את הקשר",{wide:true}))}`
      : `<div style="color:var(--text);font-size:13.5px">בחר מטרת רכישה במטרת ההלוואה כדי לפתוח את הפרטים.</div>`);
  }

  h += sec("סכום ומסלולים","",
    `<div class="grid">${fInput("purpose.amount","סכום ההלוואה המבוקש",{money:true,step:10000,req:true})}
     ${r.hasAnnuity?fInput("purpose.annuity","סכום האנונה (הלוואה חודשית) המבוקש",{money:true}):""}</div>
     <div style="margin-top:16px">${rowsBlock("tracks","מסלול",r.maxTracks,i=>{
        const t=S.data.tracks[i];
        return `<div class="grid">
          ${fInput(`tracks.${i}.amount`,"סכום",{money:true,step:10000})}
          ${fInput(`tracks.${i}.years`,"לכמה שנים",{type:"number"})}
        </div>
        <div class="grid" style="margin-top:12px">
          ${fRadio(`tracks.${i}.rate`,"סוג ריבית",r.rateOpts,{wide:true,stack:r.rateOpts.length>3})}
        </div>
        <div class="grid" style="margin-top:12px">
          ${fRadio(`tracks.${i}.repay`,"אופן ההחזר",r.repayOpts,{wide:true})}
        </div>
        ${when(t.repay==="גרייס חלקי",`<div class="grid">${fInput(`tracks.${i}.graceMonths`,"גרייס חלקי למספר חודשים",{type:"number"})}</div>`)}`;
      },blankTrack,"הוסף מסלול")}</div>
     <div class="note ${req&&diff===0?"ok":(req?"warn":"info")}" id="trackSum" style="margin:14px 0 0">
       <b>סכום מבוקש:</b> ${req?nis(req):"—"} &nbsp;·&nbsp; <b>סך המסלולים:</b> ${sum?nis(sum):"—"}
       ${req&&diff!==0?` &nbsp;·&nbsp; <b>הפרש:</b> ${nis(Math.abs(diff))} ${diff>0?"חסר במסלולים":"עודף במסלולים"}`:""}
       ${req&&diff===0?" &nbsp;·&nbsp; תואם":""}
     </div>`);

  if(has("insurance")){
    h += sec("ביטוח מבנה","איילון",
      `<div class="grid">
        ${fRadio("insurance.exists","האם קיים ביטוח מבנה?",["כן","לא"],{wide:true})}
      </div>
      ${when(S.data.insurance.exists==="לא",`<div class="grid">
        ${fRadio("insurance.wantOffer","האם הלווים מעוניינים לקבל הצעת פוליסה מסוכנות ביטוח בבעלות איילון?",["כן","לא"],{wide:true})}
      </div><div class="note info" style="margin-top:10px">תשובה חיובית משמעה הסכמה למסירת פרטי הלווים והנכס לסוכנות הביטוח.</div>`)}`);
  }

  return h + nav();
}

/* ---------- STEP 5 · annexes & consents ---------- */
function step5(){
  const r=R();
  let h=`<div class="head"><h1>נספחים והצהרות</h1><p>הנספחים שהטופס של ${esc(r.lender)} נושא, ומצב ההשלמה של כל אחד.</p></div>`;

  h += sec("נספחי הטופס",`${r.annexes.length} נספחים`,
    r.annexes.map((a,ai)=>{
      if(a.perBorrower){
        return `<div class="row" style="margin-bottom:11px"><header>${esc(a.t)}</header><div class="rbody">
          <div style="color:var(--text);font-size:13px;margin-bottom:11px">${esc(a.d)}</div>
          ${S.data.borrowers.map((b,i)=>`<div class="grid" style="margin-bottom:9px">
            ${fRadio(`borrowers.${i}.kyc`,`לווה ${i+1}${b.firstName?" · "+esc(b.firstName)+" "+esc(b.lastName):""}`,["חסר","הושלם","נדרשת בדיקה"],{wide:true})}
          </div>`).join("")}
          <div class="note info" style="margin:4px 0 0">ההתראה במייל נושאת את <b>מצב</b> ההשלמה בלבד — לא את תוכן שאלון הכר את הלקוח.</div>
          <hr class="rule">
          <div class="subhead">תוכן השאלון (מודפס כנספח נפרד לכל לווה)</div>
          <div class="grid">
            ${fRadio("kyc.purpose","מטרת נטילת ההלוואה",["רכישת דירה","בנייה עצמית","שיפוצים","מיחזור","אחר"],{wide:true})}
            ${fRadio("kyc.repaySource","מקור הכסף להחזר ההלוואה",["משכורת","אחר"],{wide:true})}
            ${fRadio("kyc.refused","האם גוף מוסדי או בנק סירב לפתוח לך חשבון מטעמי איסור הלבנת הון?",["לא","כן"],{wide:true})}
          </div>
          ${fArea("kyc.assets","פירוט הנכסים שברשותי (אם שכר הדירה שלהם אמור לשמש להחזר ההלוואה)",{rows:2})}
        </div></div>`;
      }
      return `<div class="row" style="margin-bottom:11px"><header>${esc(a.t)}</header><div class="rbody">
        <div style="color:var(--text);font-size:13px;margin-bottom:11px">${esc(a.d)}</div>
        ${fRadio(`annexes.a${ai}`,"מצב",["חסר","הושלם","נדרשת בדיקה"],{wide:true})}
      </div></div>`;
    }).join(""));

  if((r.caveats||[]).length){
    h += `<div class="note warn"><b>מאפיינים של המסמך שכדאי לדעת לפני השליחה:</b>
      <ul>${r.caveats.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>`;
  }

  h += sec("הסכמות והצהרות","",
    `<div class="opts stack">
      ${fCheck("consents.insurance","הלווים מסכימים להעברת פרטי הקשר לצורך קבלת הצעות לביטוח הנכס המשועבד")}
      ${fCheck("consents.credit","נמסרה ההודעה בנוגע לקבלת חיווי אשראי")}
      ${fCheck("consents.declarations","הלווים אישרו את הצהרות הלווים כמפורט בטופס")}
      ${fCheck("consents.privacy","נמסרה הודעת הפרטיות והשימוש במידע")}
    </div>
    <div class="note warn" style="margin-top:14px">ההצהרות נחתמות בפועל על ידי הלקוח ב־iSign, על גבי מסמך המקור של החברה. הסימון כאן הוא מעקב היועץ בלבד.</div>`);

  h += sec("פרטי מגיש הבקשה", r.agentPreprinted?"מודפס מראש בטופס":"קבוע",
    (r.agentPreprinted
      ? `<div class="note info" style="margin:0 0 13px">פרטי היועץ כבר מודפסים על גבי עותק הטופס של ${esc(r.lender)} (בשורת «שם גורם מתפעל»), ולכן אינם מוטבעים שוב על המסמך. השדות כאן משמשים לתיק בלבד.</div>`
      : "")
    + `<div class="grid">
      ${fInput("agent.name","שם יועץ המשכנתאות")}
      ${fInput("agent.phone","טלפון",{type:"tel"})}
      ${fInput("agent.number","מספר סוכן")}
    </div>`);

  h += fArea("purpose.notes","הערות נוספות",{rows:3});

  return h + nav();
}

/* ---------- STEP 6 · review & send ---------- */
function step6(){
  const r=R();
  const missing = collectMissing();
  const unmapped = unmappedFields();

  let h=`<div class="head"><h1>סקירה ושליחה</h1>
    <p>בדיקה אחרונה לפני שהמסמך נשלח ללקוח לחתימה.</p></div>
    <div class="note info"><b>המסמך שיישלח:</b> ${esc(r.lender)} · ${esc(r.productLabel)}
      ${r.doc&&r.doc!=="—"?` — טופס ${esc(r.doc)}, גרסה ${esc(r.ver)}`:""}, ${r.pages} עמודים.</div>`;

  if(S.data.demoNote){
    h += `<div class="note info">${esc(S.data.demoNote)}</div>`;
  }
  if(missing.length){
    h += `<div class="note warn"><b>חסרים ${missing.length} שדות:</b>
      <div class="miss-list">${missing.map(m=>
        `<button type="button" data-jump="${m.step}">${esc(m.label)}<span>שלב ${m.step} ←</span></button>`).join("")}</div></div>`;
  } else {
    h += `<div class="note ok"><b>כל שדות החובה מולאו.</b></div>`;
  }

  const _todo=collectedNotPrinted().filter(x=>!(NO_SLOT[r.pdfFile]||[]).includes(x));
  if(_todo.length){
    h += `<div class="note warn"><b>מיפוי חלקי במסלול זה.</b> הסעיפים הבאים קיימים בטופס של
      ${esc(r.lender)} אך אינם מוטבעים על המסמך המופק: ${_todo.map(esc).join(" · ")}.
      המסמך שיופק יהיה חסר בסעיפים אלה — אין להשתמש בו מול הלקוח עד להשלמת המיפוי.</div>`;
  }
  if(unmapped.length){
    h += `<div class="note info"><b>נאסף לתיק, אך אין לו שדה בטופס של ${esc(r.lender)}:</b>
      <ul>${unmapped.map(u=>`<li>${esc(u)}</li>`).join("")}</ul>
      המידע נשמר בתיק היועץ ואינו מודפס על גבי מסמך החברה.</div>`;
  }

  h += reviewBlocks();

  h += `<div class="send"><div class="send-h">שליחה לחתימה דיגיטלית</div><div class="send-b">
    <div class="flow">
      <div class="fl"><i>1</i><div><b>הפקת המסמך</b>
        <p>הנתונים מוטבעים על גבי מסמך המקור של ${esc(r.lender)} — ${r.pages} עמודים, ללא שינוי בנוסח או בהצהרות.</p></div></div>
      <div class="fl ${r.pdfReady?"":"pending"}"><i>2</i><div><b>בדיקה ויזואלית</b>
        <p>תצוגה מקדימה של המסמך המופק, עמוד אחר עמוד — להשוואה מול מסמך המקור.</p></div></div>
      <div class="fl pending"><i>3</i><div><b>שליחה ב־iSign</b>
        <p>המסמך המוכן נשלח ללקוח לחתימה מחשבון ה־iSign של המשרד.</p></div></div>
    </div>

    <div class="nav">
      <button class="btn n" id="genPdf" ${missing.length?"disabled":""}>הפק מסמך לבדיקה</button>
      ${missing.length?`<span style="font-size:12.5px;color:var(--warn);align-self:center">יש להשלים ${missing.length} שדות לפני הפקה</span>`:""}
      <button class="btn g" id="dlPdf" disabled>הורד PDF</button>
      <div class="sp"></div>
      <button class="btn p" id="sendISign" disabled>שלח לחתימה ב־iSign</button>
    </div>

    <div id="pdfArea" class="pv" style="margin-top:14px">לחץ «הפק מסמך לבדיקה» כדי להטביע את הנתונים על גבי מסמך המקור.</div>
  </div></div>`;

  h += `<div class="note warn" style="margin-top:16px"><b>על שילוב iSign:</b> אתר isign.co.il אינו מפרסם API או תיעוד למפתחים.
    לכן האב־טיפוס מפיק את המסמך המדויק ומעביר אותו לחתימה בנתיב שעובד היום — הורדה, או תיקיית Google Drive / Dropbox שה־iSign כבר מחובר אליה.
    הכפתור לא ידמה שליחה מוצלחת שלא קרתה. החלפה ל־API אמיתי היא פונקציה אחת.</div>`;

  h += `<div class="nav"><button class="btn g" data-nav="-1">→ הקודם</button></div>`;
  return h;
}

function reviewBlocks(){
  const r=R();
  const B=[];
  const kv = pairs => `<div class="kv">${pairs.map(([k,v])=>
    `<div>${esc(k)}</div><div class="${v===""||v==null?"empty":""}">${v===""||v==null?"—":esc(v)}</div>`).join("")}</div>`;

  S.data.borrowers.forEach((b,i)=>{
    const p=[
      ["שם מלא",`${b.firstName} ${b.lastName}`.trim()],
      ["ת.ז",b.id],["תאריך לידה",fmtDate(b.birthDate)],["מגדר",b.gender],["מצב משפחתי",b.marital],
      ["טלפון",b.phone],["דוא\"ל",b.email],
      ["כתובת",[b.street,b.city,b.zip].filter(Boolean).join(", ")],
      ["תושבות",b.residency],["מקום מגורי",b.residence===
        "אחר"?`אחר — ${b.residenceOther}`:b.residence],
      [r.childrenLabel,b.children]
    ];
    if(i>0) p.push(["קרבה ללווה 1",b.relation==="אחר"?`אחר — ${b.relationOther}`:b.relation]);
    if(b.spouseInProperty==="כן") p.push(["בן/בת זוג בנכס שאינו לווה",b.spouseName||"כן"]);
    if(has("employment")){
      p.push(["מקום עבודה",b.workplace],["ישוב עבודה",b.workCity],
        ["ותק",b.seniority==="מעל שנה"?`${b.seniorityYears||""} שנים`:b.seniority],
        ["מצב תעסוקתי",b.employment==="אחר"?`אחר — ${b.employmentOther}`:b.employment],
        ["תפקיד",b.role],["הכנסה נטו",nis(b.netIncome)]);
    }
    const inc = b.incNone ? "אין הכנסה" : [
      b.incWork&&`מעבודה ${nis(b.incWork)}`, b.incAllowance&&`מקצבה ${nis(b.incAllowance)}`,
      b.incRent&&`משכ"ד ${nis(b.incRent)}`, b.incPension&&`מפנסיה ${nis(b.incPension)}`,
      b.incAlimony&&`ממזונות ${nis(b.incAlimony)}`,
      b.incOtherAmt&&`${b.incOtherSrc||"אחר"} ${nis(b.incOtherAmt)}`
    ].filter(Boolean).join(" · ");
    p.push(["הכנסות",inc]);
    const obl=[
      b.oblLoanM&&`הלוואות ${nis(b.oblLoanM)}/חודש (יתרה ${nis(b.oblLoanB)})`,
      b.oblMortM&&`משכנתא ${nis(b.oblMortM)}/חודש (יתרה ${nis(b.oblMortB)})`,
      b.oblRent&&`שכ"ד ${nis(b.oblRent)}`, b.oblAlimony&&`מזונות ${nis(b.oblAlimony)}`,
      b.oblOtherM&&`${b.oblOtherName||"אחר"} ${nis(b.oblOtherM)}`
    ].filter(Boolean).join(" · ");
    p.push(["התחייבויות",obl],["עיקול / הוצל\"פ",b.attachment]);
    if((r.annexes||[]).some(a=>a.perBorrower)) p.push(["הכר את הלקוח",b.kyc]);
    B.push([`לווה ${i+1}`,1,kv(p)]);
  });

  if(S.data.occupants.length){
    B.push(["מי עוד גר בנכס",1,kv(S.data.occupants.map((o,i)=>
      [`דייר ${i+1}`,[`${o.firstName} ${o.lastName}`.trim(),o.id,fmtDate(o.birthDate),o.marital,o.relation].filter(Boolean).join(" · ")]))]);
  }
  if(has("contact")&&S.data.contacts.length){
    B.push(["איש קשר להחזר ההלוואה",1,kv(S.data.contacts.map((c,i)=>
      [`איש קשר ${i+1}`,[`${c.firstName} ${c.lastName}`.trim(),c.id,c.phone,c.email,c.relation,c.address].filter(Boolean).join(" · ")]))]);
  }

  const bk=S.data.bank;
  B.push(["חשבון בנק",2,kv([["בנק",bk.name],["סניף",bk.branch],["חשבון",bk.account],["בעל החשבון",bk.owner]])]);

  B.push(["נכסים לשעבוד",3,kv(S.data.collateral.map((c,i)=>[`נכס ${i+1}`,
    [ [c.street,c.num,c.apt&&`דירה ${c.apt}`,c.city].filter(Boolean).join(" "),
      (c.gush||c.helka)&&`גוש ${c.gush} חלקה ${c.helka}${c.sub?" תת "+c.sub:""}`,
      c.type, c.value&&`שווי ${nis(c.value)}`,
      c.mortgaged==="כן"&&`ממושכן ל${c.mortgagedTo||"—"}, יתרה ${nis(c.mortgageBalance)}`,
      c.seized==="כן"&&`מעוקל ל${c.seizedTo||"—"}, יתרה ${nis(c.seizedBalance)}`,
      c.rented==="כן"&&`מושכר ${nis(c.rentAmount)}/חודש`
    ].filter(Boolean).join(" · ")]))]);

  if(S.data.other.length){
    B.push(["נכסים נוספים שאינם לשיעבוד",3,kv(S.data.other.map((o,i)=>[`נכס ${i+1}`,
      [o.type,o.address,o.value&&`שווי ${nis(o.value)}`,o.rentIncome&&`שכ"ד ${nis(o.rentIncome)}`,
       o.mortgagedTo&&`ממושכן ל${o.mortgagedTo}, יתרה ${nis(o.mortgageBalance)}`].filter(Boolean).join(" · ")]))]);
  }

  const p=S.data.purpose, pu=S.data.purchase;
  const loanRows=[["מטרות",(p.list||[]).join(" · ")]];
  if(p.otherDetail) loanRows.push(["מטרה אחרת",p.otherDetail]);
  if(p.investDetail) loanRows.push(["פרטי השקעה",p.investDetail]);
  if(p.payoffDetail) loanRows.push(["סילוק",`${p.payoffDetail} · יתרה ${nis(p.payoffBalance)}`]);
  if(R().spansBoth) loanRows.push(["מטרת העסקה",S.data.deal.rank]);
  loanRows.push(["סכום מבוקש",nis(p.amount)]);
  if(R().hasAnnuity) loanRows.push(["סכום אנונה",nis(p.annuity)]);
  if(pu.kind) loanRows.push(["רכישה",[pu.kind,pu.hand].filter(Boolean).join(" · ")]);
  if(pu.fromSale||pu.equityAmount||pu.fromLoan) loanRows.push(["מקורות מימון",
    [pu.fromSale&&`ממכירת נכס ${nis(pu.fromSale)}`,
     pu.equityAmount&&`הון עצמי (${pu.equitySource||"—"}) ${nis(pu.equityAmount)}`,
     pu.fromLoan&&`מההלוואה ${nis(pu.fromLoan)}`].filter(Boolean).join(" · ")]);
  if(pu.sellerRelation) loanRows.push(["קשר משפחתי עם המוכר",pu.sellerRelation==="יש"?`יש — ${pu.sellerDetail||""}`:"אין"]);
  S.data.tracks.forEach((t,i)=>{ if(t.amount||t.rate)
    loanRows.push([`מסלול ${i+1}`,[nis(t.amount),t.years&&`${t.years} שנים`,t.rate,
      t.repay==="גרייס חלקי"&&t.graceMonths?`גרייס חלקי ${t.graceMonths} חודשים`:t.repay].filter(Boolean).join(" · ")]);
  });
  B.push(["ההלוואה",4,kv(loanRows)]);

  const cs=S.data.consents;
  B.push(["נספחים והסכמות",5,kv([
    ...(R().annexes||[]).map((a,i)=>[a.t, a.perBorrower
      ? S.data.borrowers.map((b,bi)=>`לווה ${bi+1}: ${b.kyc}`).join(" · ")
      : (S.data.annexes["a"+i]||"")]),
    ["הסכמה לביטוח מבנה",cs.insurance?"סומן":""],
    ["חיווי אשראי",cs.credit?"סומן":""],
    ["הצהרות הלווים",cs.declarations?"סומן":""],
    ["הודעת פרטיות",cs.privacy?"סומן":""]
  ])]);

  return B.map(([t,st,body])=>`<div class="rev"><div class="rev-h"><b>${esc(t)}</b>
    <button type="button" data-jump="${st}">ערוך</button></div>${body}</div>`).join("");
}

/* ===========================================================================
   7. VALIDATE
   ======================================================================== */
function collectMissing(){
  const out=[]; S.errors={};
  S.data.borrowers.forEach((b,i)=>{
    if(!b.firstName) out.push({step:1,label:`לווה ${i+1} — שם פרטי`});
    if(!b.lastName)  out.push({step:1,label:`לווה ${i+1} — שם משפחה`});
    if(!b.id)        out.push({step:1,label:`לווה ${i+1} — תעודת זהות`});
    else if(!validId(b.id)){ out.push({step:1,label:`לווה ${i+1} — ת.ז לא תקינה (ספרת ביקורת)`}); S.errors[`borrowers.${i}.id`]="ספרת ביקורת שגויה"; }
    if(!b.phone)     out.push({step:1,label:`לווה ${i+1} — טלפון נייד`});
    else if(!validPhone(b.phone)){ out.push({step:1,label:`לווה ${i+1} — טלפון לא תקין`}); S.errors[`borrowers.${i}.phone`]="מספר לא תקין"; }
    if(b.email&&!validEmail(b.email)){ out.push({step:1,label:`לווה ${i+1} — דוא"ל לא תקין`}); S.errors[`borrowers.${i}.email`]="כתובת לא תקינה"; }
    if(!b.residence) out.push({step:1,label:`לווה ${i+1} — מקום מגורי`});
  });
  S.data.occupants.forEach((o,i)=>{
    if(o.id&&!validId(o.id)){ out.push({step:1,label:`דייר ${i+1} — ת.ז לא תקינה (ספרת ביקורת)`}); S.errors[`occupants.${i}.id`]="ספרת ביקורת שגויה"; }
  });
  S.data.contacts.forEach((c,i)=>{
    if(c.id&&!validId(c.id)){ out.push({step:1,label:`איש קשר ${i+1} — ת.ז לא תקינה (ספרת ביקורת)`}); S.errors[`contacts.${i}.id`]="ספרת ביקורת שגויה"; }
  });
  if(!S.data.purpose.amount) out.push({step:4,label:"סכום ההלוואה המבוקש"});
  const sum=S.data.tracks.reduce((a,t)=>a+(+t.amount||0),0);
  const req=+S.data.purpose.amount||0;
  if(req&&sum&&sum!==req) out.push({step:4,label:`סך המסלולים (${nis(sum)}) אינו תואם לסכום המבוקש (${nis(req)})`});
  if(!(S.data.purpose.list||[]).length) out.push({step:4,label:"מטרת ההלוואה"});
  const c=S.data.collateral[0];
  if(!c.city&&!c.gush) out.push({step:3,label:"נכס לשעבוד — כתובת או גוש/חלקה"});
  if(!c.value) out.push({step:3,label:"נכס לשעבוד — שווי להערכתי"});
  return out;
}

// fields collected per the client's brief that this lender's document has no slot for
function unmappedFields(){
  const r=R(), out=[];
  if(r.product==="regular"){
    if(S.data.occupants.length) out.push("טבלת «מי עוד גר בנכס» — קיימת בטופס ההפוכה בלבד");

  }
  if(r.lender==="איילון"&&S.data.other.length>2) out.push("נכסים נוספים מעבר לשניים");

}

/* ===========================================================================
   8. BIND
   ======================================================================== */
function bind(){
  const m=$("#main");

  m.querySelectorAll("[data-route]").forEach(b=>{
    b.onclick=()=>pickRoute(b.dataset.route);
    b.onmouseenter=()=>{ const r=ROUTES[b.dataset.route];
      if(r&&r.pdfFile) previewInPane(r.pdfFile,`${r.lender} · ${r.productLabel}`); };
  });
  m.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>go(S.step+(+b.dataset.nav)));
  m.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>go(+b.dataset.jump));

  m.querySelectorAll("input[data-p],select[data-p],textarea[data-p]").forEach(el=>{
    const p=el.dataset.p;
    if(el.type==="radio"){
      el.onchange=()=>{ setv(p,el.value); render(); };
    } else if(el.type==="checkbox"){
      el.onchange=()=>{ setv(p,el.checked); render(); };
    } else if(el.dataset.money){
      el.oninput=()=>{
        const raw=el.value.replace(/[^\d]/g,"");
        setv(p,raw);
        const pos=el.selectionStart, before=el.value.length;
        el.value = raw==="" ? "" : Number(raw).toLocaleString("en-US");
        const shift=el.value.length-before;
        try{ el.setSelectionRange(pos+shift,pos+shift); }catch(e){}
        liveTotals();
      };
      el.onblur=()=>{ render(); };
    } else {
      el.oninput=()=>{ setv(p,el.value); };
      el.onblur=()=>{ if(S.step===6) render(); };
    }
  });

  m.querySelectorAll("[data-purpose]").forEach(el=>{
    el.onchange=()=>{
      const l=S.data.purpose.list||(S.data.purpose.list=[]);
      const v=el.dataset.purpose;
      const i=l.indexOf(v);
      if(el.checked&&i<0) l.push(v); else if(!el.checked&&i>-1) l.splice(i,1);
      render();
    };
  });

  m.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.add;
    const f={borrowers:blankBorrower,occupants:blankOccupant,contacts:blankContact,
             collateral:blankCollateral,other:blankOther,tracks:blankTrack}[k];
    S.data[k].push(f()); render();
  });
  m.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const [k,i]=b.dataset.del.split(":");
    S.data[k].splice(+i,1); render();
  });

  if(S.step===6) bindSend();
}

// keep the running totals honest while the operator types, without re-rendering
function liveTotals(){
  const t=document.getElementById("trackSum");
  if(t){
    const req=+S.data.purpose.amount||0;
    const sum=S.data.tracks.reduce((a,x)=>a+(+x.amount||0),0);
    const d=req-sum;
    t.className="note "+(req&&d===0?"ok":(req?"warn":"info"));
    t.innerHTML=`<b>סכום מבוקש:</b> ${req?nis(req):"—"} &nbsp;·&nbsp; <b>סך המסלולים:</b> ${sum?nis(sum):"—"}`+
      (req&&d!==0?` &nbsp;·&nbsp; <b>הפרש:</b> ${nis(Math.abs(d))} ${d>0?"חסר במסלולים":"עודף במסלולים"}`:"")+
      (req&&d===0?" &nbsp;·&nbsp; תואם":"");
  }
  const c=document.getElementById("collSum");
  if(c){
    const tot=S.data.collateral.reduce((a,x)=>a+(+x.value||0),0);
    c.innerHTML=`<b>סה"כ שווי הנכסים המוצעים לשעבוד:</b> ${tot?nis(tot):"—"}`;
  }
}

function pickRoute(key){
  const r=ROUTES[key];
  if(!r||r.unavailable) return;
  if(!S.route||S.route===key){ S.route=key; ensureCaps(); render(); return; }
  impactReport(S.route,key);
}

function ensureCaps(){
  const r=R();
  while(S.data.borrowers.length>r.maxBorrowers) S.data.borrowers.pop();
  while(S.data.collateral.length>r.maxCollateral) S.data.collateral.pop();
  while(S.data.other.length>r.maxOther) S.data.other.pop();
  while(S.data.tracks.length>r.maxTracks) S.data.tracks.pop();
  if(!has("contact")) S.data.contacts=[];
  if(!S.data.agent) S.data.agent={name:"אמיר נוה",phone:"054-2844111",number:"4390"};
}

/* ---------- route-switch impact report ---------- */
function impactReport(fromKey,toKey){
  const A=ROUTES[fromKey], B=ROUTES[toKey];
  const added=[], dropped=[], kept=[];

  (B.sections||[]).forEach(s=>{ if(!(A.sections||[]).includes(s)) added.push(SECNAME[s]||s); });
  (A.sections||[]).forEach(s=>{ if(!(B.sections||[]).includes(s)) dropped.push(SECNAME[s]||s); });

  if(B.maxBorrowers<S.data.borrowers.length)
    dropped.push(`${S.data.borrowers.length-B.maxBorrowers} לווים (הטופס מאפשר עד ${B.maxBorrowers})`);
  if(B.maxCollateral<S.data.collateral.length)
    dropped.push(`${S.data.collateral.length-B.maxCollateral} נכסים לשעבוד (עד ${B.maxCollateral})`);
  if(B.maxTracks<S.data.tracks.length)
    dropped.push(`${S.data.tracks.length-B.maxTracks} מסלולים (עד ${B.maxTracks})`);

  if(JSON.stringify(A.residenceOpts)!==JSON.stringify(B.residenceOpts))
    added.push("רשימת «מקום מגורי» שונה — הבחירה הקיימת תתאפס אם אינה קיימת ברשימה החדשה");
  if(A.childrenLabel!==B.childrenLabel) added.push(`«${B.childrenLabel}» מחליף את «${A.childrenLabel}»`);
  const lostRates = S.data.tracks.filter(t=>t.rate&&!(B.rateOpts||[]).includes(t.rate)).length;
  if(lostRates) dropped.push(`${lostRates} מסלולים עם סוג ריבית שאינו קיים בטופס החדש`);
  const lostPurposes=(S.data.purpose.list||[]).filter(x=>!(B.purposeOpts||[]).includes(x));
  if(lostPurposes.length) dropped.push(`מטרות הלוואה שאינן קיימות בטופס החדש: ${lostPurposes.join(", ")}`);

  kept.push("פרטי הלווים, כתובות, ת.ז וטלפונים");
  kept.push("הכנסות, התחייבויות ופרטי חשבון הבנק");
  kept.push("נכסים לשעבוד ונכסים נוספים (עד המכסה)");

  openModal(`מעבר מ־${A.lender} · ${A.productLabel} אל ${B.lender} · ${B.productLabel}`,
    `<div class="note info">שינוי המסלול משנה את מערכת השדות. זה מה שיקרה:</div>
     ${added.length?`<div style="font-weight:700;color:var(--navy);margin:14px 0 6px">נוסף / משתנה</div>
       <ul class="dl">${added.map(x=>`<li><span class="b" style="color:var(--ok)">+</span><span>${esc(x)}</span></li>`).join("")}</ul>`:""}
     ${dropped.length?`<div style="font-weight:700;color:var(--navy);margin:14px 0 6px">יוסר</div>
       <ul class="dl">${dropped.map(x=>`<li><span class="b" style="color:var(--err)">−</span><span>${esc(x)}</span></li>`).join("")}</ul>`:""}
     <div style="font-weight:700;color:var(--navy);margin:14px 0 6px">נשמר</div>
     <ul class="dl">${kept.map(x=>`<li><span class="b" style="color:var(--accent)">=</span><span>${esc(x)}</span></li>`).join("")}</ul>`,
    [{t:"החלף מסלול",cls:"p",fn:()=>{ applySwitch(toKey); closeModal(); }},
     {t:"בטל",cls:"g",fn:closeModal}]);
}

const SECNAME={
  borrowers:"פרטי לווים", residence:"מקום מגורים", household:"משק בית",
  contact:"איש קשר לטיפול בהחזר ההלוואה", employment:"בלוק תעסוקה (מקום עבודה, ותק, מצב תעסוקתי, הכנסה נטו)",
  income:"הכנסות", obligations:"התחייבויות", bank:"חשבון בנק",
  collateral:"נכסים לשעבוד", other:"נכסים נוספים", purpose:"מטרת ההלוואה",
  purchase:"פרטי רכישה (דירה יחידה/חלופית, יד ראשונה/שניה, מקורות מימון, קשר עם המוכר)",
  tracks:"מסלולי הלוואה", insurance:"ביטוח מבנה", consents:"הצהרות", annexes:"נספחים"
};

function applySwitch(toKey){
  const B=ROUTES[toKey];
  S.data.borrowers.forEach(b=>{
    if(b.residence&&!(B.residenceOpts||[]).includes(b.residence)){ b.residence=""; b.residenceOther=""; }
    if(b.relation&&!(B.relationOpts||[]).includes(b.relation)) b.relation="";
  });
  S.data.tracks.forEach(t=>{
    if(t.rate&&!(B.rateOpts||[]).includes(t.rate)) t.rate="";
    if(t.repay&&!(B.repayOpts||[]).includes(t.repay)) t.repay="";
  });
  S.data.collateral.forEach(c=>{ if(c.type&&!(B.propTypeOpts||[]).includes(c.type)) c.type=""; });
  if(S.data.purpose.list) S.data.purpose.list=S.data.purpose.list.filter(x=>(B.purposeOpts||[]).includes(x));
  S.route=toKey; ensureCaps(); render();
}

/* ===========================================================================
   9. PDF — bidi-safe overlay merged onto the lender's original document.
   pdf-lib performs no bidi and no shaping (issue #1159 — Hebrew mixed with
   digits renders reversed), so Hebrew is NEVER laid out by pdf-lib. It is
   drawn by the browser (which does full bidi) into a canvas, and pdf-lib
   only embeds that canvas as an image over the untouched original page.
   ======================================================================== */
const PDF_DIR = "/anbar-form/pdf/";
const templates = {};                 // file -> ArrayBuffer, fetched once
let pdfState = {pages:0, cur:1, out:null};

async function template(file){
  if(!templates[file]){
    const res=await fetch(PDF_DIR+file+".pdf");
    if(!res.ok) throw new Error("template "+file);
    templates[file]=await res.arrayBuffer();
  }
  return templates[file];
}

function bindSend(){
  const g=$("#genPdf"), d=$("#dlPdf"), s=$("#sendISign");
  if(g) g.onclick=generate;
  if(d) d.onclick=()=>{
    if(!pdfState.out) return;
    const b=new Blob([pdfState.out],{type:"application/pdf"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download=`${R().lenderShort}-${R().product==="reverse"?"הפוכה":"רגילה"}-${(S.data.borrowers[0].lastName||"טופס")}.pdf`;
    a.click(); URL.revokeObjectURL(a.href);
  };
  if(s) s.onclick=()=>openModal("שליחה לחתימה ב־iSign",
    `<div class="note warn"><b>אין API ציבורי ל־iSign.</b> אתר isign.co.il אינו מפרסם תיעוד למפתחים,
      והשליחה מתבצעת מממשק המערכת עצמה (דוא"ל או SMS).</div>
     <div style="font-weight:700;color:var(--navy);margin:14px 0 6px">הנתיב שעובד היום</div>
     <ul class="dl">
       <li><span class="b">1</span><span>הורד את המסמך שהופק (הוא זהה למסמך המקור של החברה, עם הנתונים מוטבעים).</span></li>
       <li><span class="b">2</span><span>העלה אותו ב־iSign, או שמור אותו בתיקיית Google Drive / Dropbox שה־iSign כבר מחובר אליה.</span></li>
       <li><span class="b">3</span><span>שלח ללקוח לחתימה מתוך iSign, לדוא"ל או ל־SMS.</span></li>
     </ul>
     <div class="note info" style="margin-top:14px">אם אנבר יקבלו גישת API (או יעברו לספק שמפרסם אחד),
       ההחלפה כאן היא פונקציית מתאם אחת — שאר המערכת לא משתנה.</div>`,
    [{t:"סגור",cls:"g",fn:closeModal}]);
}

async function generate(){
  const area=$("#pdfArea");
  area.innerHTML=`<div><div class="spin"></div>מפיק את המסמך…</div>`;
  $("#genPdf").disabled=true;
  try{
    const out=await buildPdf();
    pdfState.out=out;
    await preview(out);
    $("#dlPdf").disabled=false;
    $("#sendISign").disabled=false;
  }catch(err){
    area.innerHTML=`<div style="color:var(--err)">לא ניתן היה להפיק את המסמך: ${esc(err.message||err)}</div>`;
  }finally{ $("#genPdf").disabled=false; }
}

/* --- overlay: browser draws the Hebrew, pdf-lib only merges --- */
async function overlay(doc,mapKey){
  const map = FIELD_MAP[mapKey]||{};
  const pages = doc.getPages();
  for(const pageNo of Object.keys(map)){
    const pg = pages[+pageNo-1];
    if(!pg) continue;
    const {width,height} = pg.getSize();
    const png = await drawOverlay(map[pageNo],width,height);
    const img = await doc.embedPng(png);
    pg.drawImage(img,{x:0,y:0,width,height});
  }
}

/* Fill the selected lender document, then append one filled KYC page per
   borrower for the routes whose annex list calls for it. */
async function buildPdf(){
  const {PDFDocument} = PDFLib;
  const r = R();
  const doc = await PDFDocument.load(await template(r.pdfFile));
  await overlay(doc, r.pdfFile);   // map keys are the file names, not the route ids

  if((r.annexes||[]).some(a=>a.perBorrower) && FIELD_MAP["clal-kyc"]){
    for(let i=0;i<S.data.borrowers.length;i++){
      kycFor = i;                                   // which borrower this copy is for
      const k = await PDFDocument.load(await template("clal-kyc"));
      await overlay(k,"clal-kyc");
      const [pg] = await doc.copyPages(k,[0]);
      doc.addPage(pg);
    }
    kycFor = 0;
  }
  return await doc.save();
}

// Render one page's values into a transparent canvas at 3x, using the browser's
// own text engine so bidi and digit order are correct by construction.
function drawOverlay(items,w,h){
  return new Promise(resolve=>{
    const SC=3;
    const cv=document.createElement("canvas");
    cv.width=Math.round(w*SC); cv.height=Math.round(h*SC);
    const ctx=cv.getContext("2d");
    ctx.scale(SC,SC);
    ctx.direction="rtl";
    ctx.textBaseline="alphabetic";
    ctx.fillStyle="#0b1a3a";
    items.forEach(it=>{
      const v=resolveVal(it);
      if(v===""||v==null||v===false) return;
      if(it.ring){                       // ring a printed choice (360 prints the option list)
        ctx.save();
        ctx.strokeStyle="#0b1a3a"; ctx.lineWidth=1.1;
        ctx.beginPath();
        ctx.ellipse(it.x,h-it.y,(it.rw||24)/2,(it.rh||10)/2,0,0,Math.PI*2);
        ctx.stroke(); ctx.restore();
        return;
      }
      if(it.mark){                       // checkbox / radio tick
        ctx.save();
        ctx.strokeStyle="#0b1a3a"; ctx.lineWidth=1.6; ctx.lineCap="round";
        const x=it.x, y=h-it.y;
        ctx.beginPath();
        ctx.moveTo(x-3,y-1); ctx.lineTo(x-1,y+2); ctx.lineTo(x+3.5,y-4.5);
        ctx.stroke(); ctx.restore();
        return;
      }
      ctx.font=`${it.size||9}px Assistant, Arial, sans-serif`;
      ctx.textAlign=it.align||"right";
      const text=String(v);
      // shrink to fit the slot rather than overflow into the next label
      let size=it.size||9;
      if(it.w){
        while(ctx.measureText(text).width>it.w && size>5.5){
          size-=0.4; ctx.font=`${size}px Assistant, Arial, sans-serif`;
        }
      }
      ctx.fillText(text,it.x,h-it.y);
    });
    // wait a frame so the webfont is definitely applied before serialising
    requestAnimationFrame(()=>{
      const b=atob(cv.toDataURL("image/png").split(",")[1]);
      const u=new Uint8Array(b.length);
      for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
      resolve(u);
    });
  });
}

function nameOf(x){ return x?`${x.firstName||""} ${x.lastName||""}`.trim():""; }
/* Flatten every borrower's obligations into the rows 360 prints. */
function allObligations(d){
  const out=[];
  d.borrowers.forEach((b,i)=>{
    const who=b.lastName?` (${b.lastName})`:"";
    if(b.oblLoanM||b.oblLoanB) out.push(["הלוואה שאינה משכנתא"+who,b.oblLoanM,b.oblLoanB]);
    if(b.oblMortM||b.oblMortB) out.push(["משכנתא"+who,b.oblMortM,b.oblMortB]);
    if(b.oblOtherM)            out.push([(b.oblOtherName||"אחר")+who,b.oblOtherM,b.oblOtherB]);
  });
  return out;
}
function oblRows(){
  const o={};
  for(let r=0;r<6;r++){
    o["oblSource"+r] =d=>(allObligations(d)[r]||[])[0]||"";
    o["oblMonthly"+r]=d=>{const v=(allObligations(d)[r]||[])[1]; return v?Number(v).toLocaleString("en-US"):"";};
    o["oblBalance"+r]=d=>{const v=(allObligations(d)[r]||[])[2]; return v?Number(v).toLocaleString("en-US"):"";};
  }
  return o;
}
/* Collateral first, then any additional property — 360 lists them in one table. */
function allProperties(d){
  return d.collateral.map(c=>({addr:propAddr(c),reg:c.registry,val:c.value,to:c.mortgagedTo,bal:c.mortgageBalance}))
    .concat(d.other.map(o=>({addr:o.address,reg:"",val:o.value,to:o.mortgagedTo,bal:o.mortgageBalance})));
}
function propRows(){
  const o={};
  for(let i=0;i<3;i++){
    o["propAddrAll"+i]=d=>(allProperties(d)[i]||{}).addr||"";
    o["propRegistry"+i]=d=>(allProperties(d)[i]||{}).reg||"";
    o["propValue"+i]  =d=>{const v=(allProperties(d)[i]||{}).val; return v?Number(v).toLocaleString("en-US"):"";};
    o["propMortTo"+i] =d=>(allProperties(d)[i]||{}).to||"";
    o["propMortBal"+i]=d=>{const v=(allProperties(d)[i]||{}).bal; return v?Number(v).toLocaleString("en-US"):"";};
  }
  return o;
}
function addrOf(b){ return b?[b.street,b.city,b.zip].filter(Boolean).join(", "):""; }
function propAddr(c){ return c?[c.street,c.num,c.apt&&`דירה ${c.apt}`,c.city].filter(Boolean).join(" "):""; }
function otherIncome(b){
  if(!b) return "";
  return [b.incAllowance&&`קצבה ${(+b.incAllowance).toLocaleString("en-US")}`,
          b.incRent&&`שכ"ד ${(+b.incRent).toLocaleString("en-US")}`,
          b.incAlimony&&`מזונות ${(+b.incAlimony).toLocaleString("en-US")}`].filter(Boolean).join(" · ");
}
function bankLine(d){ const b=d.bank||{};
  return [b.name,b.branch&&`סניף ${b.branch}`,b.account&&`חשבון ${b.account}`].filter(Boolean).join(" · "); }

function resolveVal(it){
  if(it.fnKey){
    const f=FN[it.fnKey];
    return f ? f(S.data,R(),it.arg) : "";
  }
  const v=getv(it.p);
  if(it.mark||it.ring){
    // eq === null  → tick whenever the field carries a value
    // eq defined   → tick only on an exact match
    if(it.eq===null||it.eq===undefined) return v!==""&&v!=null&&v!==false;
    return v===it.eq;
  }
  if(it.money) return v===""||v==null?"":Number(v).toLocaleString("en-US");
  if(it.date)  return fmtDate(v);
  return v;
}

/* --- preview via pdf.js --- */
async function preview(bytes){
  const area=$("#pdfArea");
  if(!window.pdfjsLib){ area.innerHTML="המסמך הופק. תצוגה מקדימה אינה זמינה."; return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const task=pdfjsLib.getDocument({data:bytes.slice(0)});
  const pdf=await task.promise;
  pdfState.pages=pdf.numPages; pdfState.cur=1;
  const render=async n=>{
    const page=await pdf.getPage(n);
    const vp=page.getViewport({scale:1.35});
    const cv=document.createElement("canvas");
    cv.width=vp.width; cv.height=vp.height;
    await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    area.innerHTML="";
    area.appendChild(cv);
    const bar=document.createElement("div");
    bar.className="pgnav";
    bar.innerHTML=`<button ${n>=pdf.numPages?"disabled":""} data-d="1">‹</button>
      <span>עמוד ${n} מתוך ${pdf.numPages}</span>
      <button ${n<=1?"disabled":""} data-d="-1">›</button>`;
    area.appendChild(bar);
    bar.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>render(n+(+b.dataset.d)));
  };
  await render(1);
}

  const map=FIELD_MAP[file]||{};

  const on=[],off=[];
  SECGROUPS.forEach(([name,keys])=>{ (keys.some(k=>blob.includes(k))?on:off).push(name); });
  return {on,off};

      education:i?"אקדמאית":"תיכונית", lifeInsurance:i?"כן":"לא"}));
  }

}
